#       --script examples/transforming_skyrim_witcher.yaml
#
# Mods are illustrative placeholders (media_ok: false -> the pipeline shows a
# neutral slate and credits each author). Swap in the real mods you use, set their
# page_url, and flip media_ok to true ONLY for authors who permitted media reuse.

title: "I Turned Skyrim Into The Witcher (With 12 Mods)"
hook_line: "Skyrim Is Now The Witcher"
format: transformation
theme: "The Witcher"
next_topic: "Transforming Skyrim into Elden Ring"
tags: [skyrim, the witcher, skyrim mods, witcher 3, modlist, transformation]
description: >
  I spent a week turning Skyrim into the dark fantasy world of The Witcher — the
  muddy villages, the silver-sword monster hunts, the candlelit gloom. Here's
  every mod that got me there, and what each one changes.

mods:
  - name: "Continent Weathers & ENB"
    author: "PlaceholderAuthor1"
    page_url: "https://www.nexusmods.com/skyrimspecialedition/mods/000001"
    summary: "Muted, overcast weather and a desaturated ENB preset that nails the Continent's mood."
    media_ok: false
  - name: "Witcher Village Overhaul"
