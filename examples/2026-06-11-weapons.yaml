segments:
- kind: hook
  narration: Skyrim is over a decade old, but thanks to its modding community it has never looked or played
    better — especially when it comes to weapon mods. Today I'm counting down 15 of the absolute best
    weapon mods you can install right now, all of them free, all of them linked down below. Stick around
    to the end, because the number one pick is the one I genuinely couldn't play without. Let's jump in.
- kind: intro
  narration: 'Quick note before we start: everything here is completely free on Nexus Mods, and every
    creator is credited in the description, so please go endorse their work — it''s the least we can do
    for this much free content. We''re counting down from number fifteen all the way to number one, so
    settle in. Here we go.'
- kind: mod
  ref: 1
  narration: 'Number fifteen: JaySuS Swords by zeknapain. Official port with permission from the author.
    The legendary weapon pack with over 4mil downloads is finally here, with updated plugins, fixes, patches
    and more. Every blade is lore-friendly and properly balanced, so nothing here feels like cheating.
    Combined with the other picks on this list, it adds up to a dramatically better Skyrim. Whether you''re
    a sword-and-board warrior or a sneaky assassin, there''s something here calling your name. With well
    over 12 thousand endorsements, the community clearly agrees this one''s special.'
- kind: mod
  ref: 2
  narration: 'At number fourteen: Katana Crafting by lautasantenni. New version for the Skyrim AE with
    more content. The craftsmanship on the models and textures is genuinely on par with official content.
    If you somehow haven''t tried it yet, consider this your sign to fix that. Paired with the other mods
    on this list, it turns loot into something you actually get excited about again. With well over 14
    thousand endorsements, the community clearly agrees this one''s special.'
- kind: mod
  ref: 3
  narration: 'Coming in at number thirteen: Believable weapons by jg1. Mesh replacer for 113 of Skyrim''s
    original axes, maces, swords and warhammers. Opts for a slimmer and cleaner design, while keeping
    the original style. It folds right into the world''s leveled lists, so you''ll find these naturally
    as you explore. It''s stable, well-supported, and beloved for good reason. It''s a must-have for anyone
    who''s tired of swinging the same handful of vanilla weapons for the hundredth time. With well over
    14 thousand endorsements, the community clearly agrees this one''s special.'
- kind: mod
  ref: 4
  narration: 'Next up, number twelve: DX Faction Crossbows by DeserterX. This mod adds a craftable crossbow,
    unique quiver and four types of bolts for each of the following factions:CompanionsDawnguardDark BrotherhoodThieves.
    Whether you''re a sword-and-board warrior or a sneaky assassin, there''s something here calling your
    name. This is one of those installs you''ll keep in every single playthrough. Every blade is lore-friendly
    and properly balanced, so nothing here feels like cheating. With well over 16 thousand endorsements,
    the community clearly agrees this one''s special.'
- kind: mod
  ref: 5
  narration: 'Number eleven on the list: Heavy Armory - New Weapons by PrivateEye. This mod adds over
    150 new weapons to Skyrim, which include all new Halberds, Spears, Glaives, Shortswords, Quarter staves,
    Mauls, Hatchets and Clubs. Looking for some new gear to bash a skull in with (or get your skull bashed
    in with)? Paired with the other mods on this list, it turns loot into something you actually get excited
    about again. It''s the kind of mod that quietly makes everything around it better. The craftsmanship
    on the models and textures is genuinely on par with official content. With well over 18 thousand endorsements,
    the community clearly agrees this one''s special.'
- kind: mod
  ref: 6
  narration: 'Then at number ten: Dawnguard Arsenal by Madcat221. You knew it would come to this one day.
    You knew, and no one believed. It''s a must-have for anyone who''s tired of swinging the same handful
    of vanilla weapons for the hundredth time. It''s free, it''s polished, and it slots neatly into almost
    any load order. It folds right into the world''s leveled lists, so you''ll find these naturally as
    you explore. With well over 19 thousand endorsements, the community clearly agrees this one''s special.'
- kind: mod
  ref: 7
  narration: 'Number nine: Scoped Bows by OutLaw666. The amazing Bow Sights Mod - Special. Every blade
    is lore-friendly and properly balanced, so nothing here feels like cheating. Combined with the other
    picks on this list, it adds up to a dramatically better Skyrim. Whether you''re a sword-and-board
    warrior or a sneaky assassin, there''s something here calling your name. With well over 22 thousand
    endorsements, the community clearly agrees this one''s special.'
- kind: mod
  ref: 8
  narration: 'At number eight: Lore Weapon Expansion by InsanitySorrow. Lore Weapon Expansion (L. W. E)
    is a project that aims to expand the available weapons found in-game via loot and the crafting menu.
    The craftsmanship on the models and textures is genuinely on par with official content. If you somehow
    haven''t tried it yet, consider this your sign to fix that. Paired with the other mods on this list,
    it turns loot into something you actually get excited about again. With well over 25 thousand endorsements,
    the community clearly agrees this one''s special.'
- kind: mod
  ref: 9
  narration: 'Coming in at number seven: Royal Armory - New Artifacts by PrivateEye. Adds special weapons
    to the most important characters in Skyrim. Ulfric Stormcloak and General Tullius now carry weapons
    to fit their station! It folds right into the world''s leveled lists, so you''ll find these naturally
    as you explore. It''s stable, well-supported, and beloved for good reason. It''s a must-have for anyone
    who''s tired of swinging the same handful of vanilla weapons for the hundredth time. With well over
    27 thousand endorsements, the community clearly agrees this one''s special.'
- kind: mod
  ref: 10
  narration: 'Next up, number six: Skyrim SE Expanded Skyrim Weaponry by the author. This is a mod that
    adds 105 new standalone weapons. 10 for each of the main material types (Iron, Steel, Orcish, Dwarven,
    Elven, Glass, Ebony, Dragonbone, Nordic and Daedric) and 5 for Stalhrim. Whether you''re a sword-and-board
    warrior or a sneaky assassin, there''s something here calling your name. This is one of those installs
    you''ll keep in every single playthrough. Every blade is lore-friendly and properly balanced, so nothing
    here feels like cheating. With well over 28 thousand endorsements, the community clearly agrees this
    one''s special.'
- kind: mod
  ref: 11
  narration: 'Number five on the list: Belt-Fastened Quivers by Chesko. Belt-Fastened Quivers repositions
    quivers and crossbow bolts in order to be more "backpack friendly" for the player and all NPCs. The
    position is similar to the quiver location in Dark Souls. Paired with the other mods on this list,
    it turns loot into something you actually get excited about again. It''s the kind of mod that quietly
    makes everything around it better. The craftsmanship on the models and textures is genuinely on par
    with official content. With well over 32 thousand endorsements, the community clearly agrees this
    one''s special.'
- kind: mod
  ref: 12
  narration: 'Then at number four: Guards Armor Replacer by DanielUA. Replacer for guards and Stormcloak
    Armor. It''s a must-have for anyone who''s tired of swinging the same handful of vanilla weapons for
    the hundredth time. It''s free, it''s polished, and it slots neatly into almost any load order. It
    folds right into the world''s leveled lists, so you''ll find these naturally as you explore. With
    well over 35 thousand endorsements, the community clearly agrees this one''s special.'
- kind: mod
  ref: 13
  narration: 'Number three: Zim''s Immersive Artifacts by Zimmermjaz. Adds lore-friendly, balanced improvements
    to the under-powered artifacts of Skyrim. Every blade is lore-friendly and properly balanced, so nothing
    here feels like cheating. Combined with the other picks on this list, it adds up to a dramatically
    better Skyrim. Whether you''re a sword-and-board warrior or a sneaky assassin, there''s something
    here calling your name. With well over 36 thousand endorsements, the community clearly agrees this
    one''s special.'
- kind: mod
  ref: 14
  narration: 'At number two: Unique Uniques by calthrop. A conversion of InsanitySorrow''s mod Unique
    Uniques updated for Skyrim Special Edition. The craftsmanship on the models and textures is genuinely
    on par with official content. If you somehow haven''t tried it yet, consider this your sign to fix
    that. Paired with the other mods on this list, it turns loot into something you actually get excited
    about again. With well over 63 thousand endorsements, the community clearly agrees this one''s special.'
- kind: mod
  ref: 15
  narration: 'And finally, the number one pick on the whole list: Immersive Weapons by hothtrooper44.
    Immersive Weapons seeks to drastically enhance the variety of weapons in the world of Skyrim in a
    lore friendly way. It folds right into the world''s leveled lists, so you''ll find these naturally
    as you explore. It''s stable, well-supported, and beloved for good reason. It''s a must-have for anyone
    who''s tired of swinging the same handful of vanilla weapons for the hundredth time. With well over
    114 thousand endorsements, the community clearly agrees this one''s special. Honestly, if you only
    install one mod from this entire video, make it this one — it''s the perfect note to end on.'
- kind: outro
  narration: And that's the list — 15 of the best weapon mods in 2026. Every mod is linked below with
    full credit to the brilliant authors who made them, so go show them some love. If this helped you
    out, subscribe, because I put out two new Skyrim modding videos every single week. Thanks so much
    for watching, and I'll see you in the next one.
