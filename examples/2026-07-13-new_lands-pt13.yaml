slug: 2026-07-13-new_lands-pt13
title: 10 Skyrim New Lands Mods You Probably Missed (Vol. 13)
category_id: new_lands
format: category_list
hook_line: Best New Lands Mods
description: Ten more hidden new lands, islands and worlds for Skyrim in 2026, counted down from 10 to
  1. Every mod is free and linked below with full credit — go endorse the authors!
tags:
- skyrim new lands mods
- skyrim new worldspace
- skyrim dlc mods
- skyrim exploration
- skyrim mods 2026
- skyrim island mods
- skyrim hidden mods
segments:
- kind: hook
  narration: Bethesda gave us one Skyrim, but modders keep smuggling in the places it forgot, lost colonies
    of Akavir, sunken ruins, a slice of Morrowind, even the Snow Elves' hidden homeland. Today I've got
    ten more brand-new lands you probably missed, and my number one takes you back into the most beautiful
    corner of the whole game. Let's explore.
- kind: intro
  narration: Every mod here drops a fresh place into your current save, all free on Nexus with the creators
    credited below, so please go endorse them. We're counting down from number ten to number one. Let's
    get into it.
- kind: mod
  ref: 1
  narration: 'Number ten: the Systres Islands by elafrosicky. Fans of Elder Scrolls Online always wondered
    why the Systres archipelago, that gorgeous chain out west, never made it into Skyrim. This mod finally
    brings it, a brand-new lore-friendly worldspace built out with LOD terrain, merchants, inns, and over
    forty locations to discover, with a hidden secret or two along the way. What makes it worth the trip
    is the completeness, this isn''t an empty island, it''s a populated chain with places to stay and
    people to trade with. You can reach it two ways, a cheaper route from Solstheim or a pricier one from
    Solitude, so it slots naturally into your travels. It''s a growing community project built on earlier
    work, so a rough edge here and there, but as a fresh forty-location worldspace it''s a fantastic start.
    Now let''s sail somewhere far stranger.'
- kind: mod
  ref: 2
  narration: At number nine, Freeport Island by TurelimVampire, and this one's for the crossover crowd.
    If you've ever wanted a corner of Skyrim that feels nothing like Tamriel, Freeport delivers, it's
    a new worldspace lifted straight from the Legacy of Kain universe, recreating the Freeport map from
    the game Nosgoth, complete with ruined forts, temples, and a brooding gothic atmosphere all its own.
    The appeal is pure novelty, it's a striking, unfamiliar place to explore that no lore-friendly mod
    could ever give you. The newest version even added quest markers and fixed the navmesh in a few cells,
    so it's more playable than ever. Obviously it's a crossover fantasy, not canon Tamriel, so skip it
    on a strict roleplay run, but as a haunting detour it's unforgettable. Next, we go underground.
- kind: mod
  ref: 3
  narration: 'Number eight: Henantir''s Steamcrag by ArcaneUniversity. Deep beneath the slippery steps
    of High Hrothgar, the mod tells us, a sundered snow tower lies kingless and forgotten, and vanilla
    never lets you set foot in it. Steamcrag opens that hidden underworld, a brand-new descent brimming
    with life, mischief, and abnormalities we''re honestly better off leaving alone, waiting under one
    of Skyrim''s most famous landmarks. What sells it is the location, the idea that all this has been
    sitting right below the Greybeards this whole time is a brilliant hook. It''s atmospheric, self-contained,
    and beautifully written in its own darkly comic way. A perfect bite-sized descent for an evening.
    Now, from the depths to an entire lost continent.'
- kind: mod
  ref: 4
  narration: Coming in at number seven, the Lost Colony of Akavir by SETVI. Akavir, the mysterious continent
    across the sea, is the single most requested place Elder Scrolls fans want to visit, and it almost
    never happens. This is an ambitious port of a genuinely huge new land that takes you to an Akaviri
    colony, a sprawling foreign world completely unlike Skyrim. The scale is the whole draw, very few
    mods even attempt Akavir, and fewer still at this size. Now, I'll be honest, the author flags it as
    their first big port, so expect some quirks, the odd floating object, a placeholder line here and
    there, and you can't rent an inn bed. But for the sheer thrill of finally exploring Akavir, those
    rough edges are easy to forgive. Now for an island that fights back.
- kind: mod
  ref: 5
  narration: At number six, Umbra Island, the Director's Cut by SerchBoogie. Too many location mods are
    walk-in-the-park sightseeing, and sometimes you want a place that actually challenges you. Umbra Island
    is exactly that, a new island-dungeon packed with hazards, puzzles, and five genuinely tough bosses,
    rewarding you with five new armour sets and a powerful sword for those who conquer it. Best of all,
    it refuses to hold your hand, once you're on the island, you're on your own. That old-school, figure-it-out
    design is what makes it stand out, it treats you like an adventurer, not a tourist following a marker.
    If you miss the days when Skyrim actually tested you, this is a brilliant, self-contained challenge
    with real loot at the end. Next, a genuine slice of Morrowind.
- kind: mod
  ref: 6
  narration: 'Number five: Morrowind, the Vvardenfell Return, West Gash by LordDom65. Every Elder Scrolls
    veteran dreams of walking Vvardenfell again, and most attempts feel like empty ash. This mod recreates
    the northern West Gash region, the territory governed by the mighty House Redoran, complete with its
    regional capital and that unmistakable Dunmer character. What lifts it is the authenticity, it clearly
    comes from someone who loves Morrowind and wants Redoran''s mushroom-and-ash aesthetic done right.
    It''s part of a larger community effort to rebuild Tamriel piece by piece, so it''s a growing project
    rather than a finished expansion, but wandering a faithful chunk of Vvardenfell in Skyrim''s engine
    is a real treat for the lore-obsessed. Now let''s find somewhere with a bit more mischief.'
- kind: mod
  ref: 7
  narration: At number four, Moonfang Island by ArcwindSaber. Here's a clever one, a fully lore-friendly
    new town with a twist hiding inside it. Moonfang adds a small, believable settlement, reached by clearing
    a one-time dungeon in the cave at Clearspring Tarn, but tucked away is a shrine that leads to a hubworld
    the author cheekily calls the nexus, a lore-friendly-ish home for all your custom and less-lore-friendly
    assets. That's the smart part, it gives you a proper immersive town AND a tidy out-of-the-way place
    to stash the wackier stuff without breaking your main world. It's compact and thoughtfully made, the
    kind of mod that solves a problem you didn't know you had. Next up, time to go hunting.
- kind: mod
  ref: 8
  narration: 'Number three: Hunters World by agerweb. If your Skyrim is stuffed with combat and quest
    mods but nothing that just lets you slow down and hunt, this fills that gap beautifully. Hunters World
    adds a new coastal area, reached via Hunters Pier near Solitude, built around the theme of the hunt,
    with wildlife, atmosphere, and a self-contained little world to lose an afternoon in. The appeal is
    the change of pace, it''s not about saving the world, it''s about the quiet pleasure of exploring
    and living off the land. agerweb is a prolific, well-respected author, and the polish shows. One heads-up,
    if you add it mid-save, clean the save first or you may spawn in the water, but set up right, it''s
    a lovely, laid-back retreat. Now into the top two.'
- kind: mod
  ref: 9
  narration: At number two, Underwater Solstheim by YeahButIronically. Skyrim's oceans are gorgeous and
    almost completely empty, all that water and nothing to actually do beneath it. This mod fixes that
    around Solstheim, adding over two dozen encounters, points of interest, marked and unmarked locations,
    and even small dungeons, all hidden under the waves. What makes it special is that it turns swimming
    from a way to get somewhere into a reason to explore, suddenly the sea floor is worth diving into.
    It pairs perfectly with the other underwater mods out there, building toward a Skyrim where the water
    is as full of secrets as the land. It's an addon in spirit rather than a grand new land, but a genuinely
    inspired one. And finally, my number one pick.
- kind: mod
  ref: 10
  narration: 'And finally, my number one on this list: the Unmarked Locations Pack, Forgotten Vale by
    GeraldMods. The Forgotten Vale from the Dawnguard DLC is one of the most breathtaking places in all
    of Skyrim, and it''s criminally underused, you visit once for the main quest and never have a reason
    to return. This mod changes that, adding a whole series of new unmarked locations throughout the Snow
    Elves'' forgotten homeland, each with its own loot, unique interactions, and encounters to stumble
    upon. That''s why it tops the list, it takes a stunning area you already love and rewards you for
    actually exploring it, the way the base game should have. It''s part of a fantastic wider series,
    it''s beautifully restrained, and with over thirteen hundred endorsements it''s clearly struck a chord.
    If you install one thing from this video, wander back into the Forgotten Vale. Go and get lost.'
- kind: outro
  narration: And that's ten more hidden lands for your load order, every one free and linked below. Tell
    me in the comments which one you're exploring first, subscribe for more Skyrim mod videos, and I'll
    catch you in the next one. Happy modding, everyone.
