slug: 2026-06-08-new-lands-pt4
title: 12 MORE Skyrim New Lands & Dungeon Mods! (Part 4)
category_id: new_lands
format: category_list
hook_line: 12 MORE Worlds to Explore
description: Part 4! Twelve more new lands, underground worlds, dungeons, and big quests for Skyrim. Every
  mod linked below, full credit to the authors.
segments:
- kind: hook
  narration: Still hungry for more places to explore in Skyrim? Good — because we are only getting deeper.
    Today I've got twelve more incredible mods that add entire underground worlds, sprawling new dungeons,
    surreal Daedric realms, and epic large-scale quests. Whether you want to delve, explore, or fight
    a full-blown war, this list has something for you. And stick around, because some of these are the
    most creative mods in the entire community. Let's dive in. And by the end, your map is going to be
    absolutely covered in new places to go.
- kind: intro
  narration: As always, everything here is one hundred percent free on Nexus Mods, every creator is linked
    in the description, and you should go endorse them all. We're counting down from number twelve to
    number one. Get comfortable, grab a snack, and let's add a few dozen more hours to your next playthrough.
    Here we go.
- kind: mod
  ref: 1
  narration: 'Number Twelve: Blackreach Railroad by trainwiz. Blackreach Railroad restores a sense of
    Dwemer ingenuity by adding a working railway through the vast underground of Blackreach, connecting
    its far-flung locations and weaving in exploration and lore along the way. Riding the rails through
    that glowing subterranean world is a genuinely magical, one-of-a-kind experience. Creative, lore-friendly,
    and a joy to discover. Beyond the novelty, it genuinely makes exploring the enormous Blackreach far
    more practical and rewarding, surfacing corners of that world you''d otherwise never see. It''s one
    of those ideas so clever you''ll wonder why it wasn''t in the base game.'
- kind: mod
  ref: 2
  narration: 'Number Eleven: Ravengate - Riften Underground by NexusModsCaretaker. Ravengate adds a dark,
    dangerous underground network beneath Riften, complete with its own questline, enemies, and secrets.
    It expands one of the game''s most atmospheric cities downward into a whole new layer of intrigue
    and danger. If you love Riften''s seedy underbelly, this takes it literally, and it''s a great self-contained
    adventure. The questline ties it all together with a proper story and a satisfying conclusion, and
    the claustrophobic atmosphere is fantastic. It''s a perfect bite-sized expansion for anyone who loves
    Riften''s shadowy, criminal side.'
- kind: mod
  ref: 3
  narration: 'Number Ten: EasierRider''s Dungeon Pack by EasierRider. EasierRider''s Dungeon Pack is a
    huge collection of new dungeons and locations scattered across Skyrim, all integrated seamlessly into
    the world. There''s a tremendous amount of content here to discover, with varied themes and plenty
    of loot. It''s one of the most generous exploration mods around, and a staple for players who just
    want more places to adventure. Because it''s so seamlessly integrated, you''ll stumble onto these
    places naturally as you wander, each one a little surprise. For players who treat the map as something
    to fully conquer, it''s an absolute goldmine of fresh objectives and loot.'
- kind: mod
  ref: 4
  narration: 'Number Nine: The Second Great War by Reath1. The Second Great War throws you into a massive,
    large-scale conflict as the Aldmeri Dominion invades, delivering epic battles, new locations, and
    a sweeping war story. If you''ve ever wanted Skyrim''s civil war to feel bigger and more consequential,
    this scratches that itch with ambition and scale. Grab a sword and prepare for war. New armies, new
    battles, and high-stakes decisions give the conflict the epic feel the base game only hinted at. If
    you''re the type who wishes Skyrim leaned harder into its war-torn setting, this delivers a sweeping
    military campaign worth fighting through.'
- kind: mod
  ref: 5
  narration: 'Number Eight: SIRENROOT - Deluge of Deceit by Everglaid. Sirenroot is a stunning, atmospheric
    exploration quest centered on a colossal, magical glowing tree-cavern. It''s a feast for the eyes,
    full of clever environmental puzzles, gorgeous lighting, and a haunting sense of wonder. It''s a relatively
    short but absolutely beautiful experience that shows just how artistic Skyrim mods can be. One of
    the prettiest quests you''ll ever play. The central puzzle is satisfying without ever being frustrating,
    and the payoff is genuinely breathtaking. It''s proof that a mod doesn''t need to be enormous to be
    unforgettable — sometimes it just needs vision, and Sirenroot has it in spades. Play it for the spectacle
    alone.'
- kind: mod
  ref: 6
  narration: 'Number Seven: The Elder Scrolls V Rewritten - Arvak SE by Tooneyman. This gives the beloved
    skeletal horse Arvak the proper questline he always deserved. Instead of a simple Soul Cairn reward,
    you uncover Arvak''s tragic backstory across a thoughtful, lore-rich adventure. It''s a heartfelt
    little journey that adds real meaning to one of the game''s coolest mounts. A must for anyone who
    loves the Elder Scrolls'' hidden stories. It''s fully woven into the world with care, and the payoff
    makes earning your loyal undead steed feel genuinely special. For a game full of forgettable fetch
    quests, this is a reminder of how much heart a small, well-made story can have.'
- kind: mod
  ref: 7
  narration: 'Number Six: Sidequests of Skyrim by wSkeever. Sidequests of Skyrim does exactly what it
    says — it weaves a collection of brand-new, lore-friendly side quests throughout the existing world.
    They''re written to feel like they belong in the base game, popping up naturally as you explore and
    giving you fresh little stories to chase. It''s a wonderful way to make the world feel busier and
    more alive without any jarring additions. None of them feel like filler — they''re crafted with care,
    with proper objectives, characters, and rewards. It''s one of the best ways to make Skyrim feel like
    a denser, more handcrafted world without changing anything you already love about it.'
- kind: mod
  ref: 8
  narration: 'Number Five: Dungeons - Revisited by Cooleoj. Another fantastic dungeon pack, Dungeons Revisited
    adds a series of intricate, atmospheric new dungeons designed with real care. Each one feels distinct
    and rewarding, with thoughtful layouts and satisfying payoffs. Stack it with the other dungeon mods
    on this list and you''ll never run out of fresh places to delve. Pure, high-quality exploration content.
    Each location tells a little environmental story, with hand-placed details that reward careful exploration.
    It''s the kind of quality dungeon content that makes you slow down and actually look around, rather
    than just rushing to the boss. A connoisseur''s pick for dungeon lovers.'
- kind: mod
  ref: 9
  narration: 'Number Four: Carved Brink by HaemProjects. From the wonderfully mad mind behind the Wheels
    of Lull comes Carved Brink — a surreal, dreamlike journey into a bizarre Daedric realm unlike anything
    in the base game. Expect imaginative environments, strange creatures, clever writing, and lore so
    deep it''ll make your head spin in the best way. If you want a quest that''s genuinely weird, creative,
    and unforgettable, this is it. It leans hard into Elder Scrolls cosmology and the stranger corners
    of the lore, rewarding longtime fans with ideas no other quest dares to touch. It''s funny, it''s
    unsettling, it''s gorgeous, and it will absolutely stick in your memory long after you finish it.'
- kind: mod
  ref: 10
  narration: 'Number Three: Skyrim Underground SSE by AncientKane. This adds a genuinely massive interconnected
    underground beneath all of Skyrim — a sprawling web of tunnels, caverns, and forgotten passages linking
    the holds. It''s packed with enemies, loot, secrets, and eerie atmosphere, and it makes the map you
    thought you knew feel twice as deep. Spelunkers and explorers will absolutely lose themselves down
    here. A huge, ambitious addition to the world. Whole questlines, hidden bosses, and unexpected vistas
    wait in the dark, and it all connects up in clever, surprising ways. If you''ve ever wished Skyrim
    had a true subterranean frontier to conquer, this is hours upon hours of fresh, atmospheric exploration
    right beneath your feet.'
- kind: mod
  ref: 11
  narration: 'Number Two: Forgotten Dungeons (SSE) by juhaantero68. Vanilla dungeons can get repetitive
    fast. Forgotten Dungeons adds a generous set of brand-new, hand-built dungeons across the world, each
    with its own theme, layout, challenging encounters, and rewarding loot at the end. It''s the perfect
    background install that turns ordinary exploration into constant surprise. Simple, polished, and endlessly
    replayable. The encounters are tuned to actually challenge a leveled character, so it stays fun deep
    into a playthrough. Drop it in and suddenly every unexplored marker on your map could be hiding a
    brand-new adventure with a real reward at the end.'
- kind: mod
  ref: 12
  narration: 'Number One: The Paarthurnax Dilemma by Arthmoor. This tackles one of the most controversial
    moments in the whole game. Vanilla Skyrim forces you to murder Paarthurnax to please the Blades —
    no discussion. This beloved mod hands the choice back to you, letting you broker peace, defy the Blades,
    and shape the outcome with real consequences. It''s a small change that fixes a huge sore spot, and
    it''s been an essential install for years. It restores roleplay sense to the main quest''s ending
    and lets your Dragonborn act with honor instead of being railroaded. Whether you side with the old
    dragon or the Blades, the choice finally feels like yours, and it carries real weight for how the
    story closes out.'
- kind: outro
  narration: And there's twelve more adventures to pile onto your ever-growing list. Every mod is linked
    below with full credit to the amazing authors — please go endorse them. Let me know your favorite
    in the comments, and subscribe for two new Skyrim videos every week. See you in the next one.
