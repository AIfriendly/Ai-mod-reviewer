- '2026'
segments:
- kind: hook
  narration: Skyrim is over a decade old, but thanks to its modding community it has never looked or played
    better — especially when it comes to magic mods. Today I'm counting down 15 of the absolute best magic
    mods you can install right now, all of them free, all of them linked down below. Stick around to the
    end, because the number one pick is the one I genuinely couldn't play without. Let's jump in.
- kind: intro
  narration: 'Quick note before we start: everything here is completely free on Nexus Mods, and every
    creator is credited in the description, so please go endorse their work — it''s the least we can do
    for this much free content. We''re counting down from number fifteen all the way to number one, so
    settle in. Here we go.'
- kind: mod
  ref: 1
  narration: 'Number fifteen: Phenderix Magic Evolved by phenderix. Magic Evolved adds 170+ new and unique
    spells to the game in an organic and balanced method. If you''ve ever felt like vanilla magic runs
    out of steam by mid-game, this is exactly the kind of mod that fixes it. Combined with the other picks
    on this list, it adds up to a dramatically better Skyrim. It slots cleanly alongside the other mods
    on this list, so you can stack them into one cohesive overhaul. With well over 9 thousand endorsements,
    the community clearly agrees this one''s special.'
- kind: mod
  ref: 2
  narration: 'At number fourteen: Enhanced Atronachs - With Levelling and Luminosity by Raxyx7. Enhances
    atronach effectiveness according to tier and elemental type of summons. Unique ability applied to
    master-level powerful summons. Unlocked levelling. Lighting. It''s the sort of thing that makes a
    pure mage run feel viable from level one all the way to the end. If you somehow haven''t tried it
    yet, consider this your sign to fix that. For anyone who''s only ever played a stealth archer, this
    is the mod that finally makes magic tempting. With well over 9 thousand endorsements, the community
    clearly agrees this one''s special.'
- kind: mod
  ref: 3
  narration: 'Coming in at number thirteen: Thaumaturgy - An Enchanting Overhaul by SimonMagus. Thaumaturgy
    is a complete overhaul of Skyrim’s enchanting system designed to balance existing enchantments and
    add powerful new weapon and armor enchantments to the game. The spell effects are gorgeous too, so
    your screen actually looks like you''re casting real, dangerous magic. It''s stable, well-supported,
    and beloved for good reason. It''s lightweight, lore-friendly, and balanced, which is rarer than it
    should be in magic mods. With well over 10 thousand endorsements, the community clearly agrees this
    one''s special.'
- kind: mod
  ref: 4
  narration: 'Next up, number twelve: Forgotten Magic Redone by the author. Forgotten Magic Redone SE
    brings you some of the most comprehensive and intriguing spells for Skyrim Special Edition to date!
    It slots cleanly alongside the other mods on this list, so you can stack them into one cohesive overhaul.
    This is one of those installs you''ll keep in every single playthrough. If you''ve ever felt like
    vanilla magic runs out of steam by mid-game, this is exactly the kind of mod that fixes it. With well
    over 10 thousand endorsements, the community clearly agrees this one''s special.'
- kind: mod
  ref: 5
  narration: 'Number eleven on the list: Flying Mod Beta by porroone and Flying Mod Overhaul by Indefiance
    by Dresvarpr. This is the mod famous in the Oldrim, allows the character to FLY! For anyone who''s
    only ever played a stealth archer, this is the mod that finally makes magic tempting. It''s the kind
    of mod that quietly makes everything around it better. It''s the sort of thing that makes a pure mage
    run feel viable from level one all the way to the end. With well over 11 thousand endorsements, the
    community clearly agrees this one''s special.'
- kind: mod
  ref: 6
  narration: 'Then at number ten: Face Light by tktk1. This mod adds lighting spell "Facelight" make face
    look beautiful. There are improve in face shadows. It''s lightweight, lore-friendly, and balanced,
    which is rarer than it should be in magic mods. It''s free, it''s polished, and it slots neatly into
    almost any load order. The spell effects are gorgeous too, so your screen actually looks like you''re
    casting real, dangerous magic. With well over 13 thousand endorsements, the community clearly agrees
    this one''s special.'
- kind: mod
  ref: 7
  narration: 'Number nine: Arcanum - A New Age of Magic by noptasis. Years in the making, Arcanum is a
    massive spell mod that aims to combine unique gameplay with visual effects of a quality never attempted
    before in Skyrim. If you''ve ever felt like vanilla magic runs out of steam by mid-game, this is exactly
    the kind of mod that fixes it. Combined with the other picks on this list, it adds up to a dramatically
    better Skyrim. It slots cleanly alongside the other mods on this list, so you can stack them into
    one cohesive overhaul. With well over 16 thousand endorsements, the community clearly agrees this
    one''s special.'
- kind: mod
  ref: 8
  narration: 'At number eight: Triumvirate - Mage Archetypes by EnaiSiaion. Triumvirate adds 75 balanced
    spells divided among 5 mage archetypes (druid, shadow mage, warlock, cleric, shaman), which are available
    immersively through vendors. It''s the sort of thing that makes a pure mage run feel viable from level
    one all the way to the end. If you somehow haven''t tried it yet, consider this your sign to fix that.
    For anyone who''s only ever played a stealth archer, this is the mod that finally makes magic tempting.
    With well over 18 thousand endorsements, the community clearly agrees this one''s special.'
- kind: mod
  ref: 9
  narration: 'Coming in at number seven: Strange Runes by powerofthree. Cast spells in style with magic
    runes! Glowing glyphs will appear when casting spells or scrolls. The spell effects are gorgeous too,
    so your screen actually looks like you''re casting real, dangerous magic. It''s stable, well-supported,
    and beloved for good reason. It''s lightweight, lore-friendly, and balanced, which is rarer than it
    should be in magic mods. With well over 18 thousand endorsements, the community clearly agrees this
    one''s special.'
- kind: mod
  ref: 10
  narration: 'Next up, number six: Visual Animated Enchants - VAE by L3st4t. A replacer for the visual
    and animation of the enchantments on weapons to make them more magical and. It slots cleanly alongside
    the other mods on this list, so you can stack them into one cohesive overhaul. This is one of those
    installs you''ll keep in every single playthrough. If you''ve ever felt like vanilla magic runs out
    of steam by mid-game, this is exactly the kind of mod that fixes it. With well over 18 thousand endorsements,
    the community clearly agrees this one''s special.'
- kind: mod
  ref: 11
  narration: 'Number five on the list: Acquisitive Soul Gems Multithreaded by eyeonus. This plugin changes
    the soul trap spells and enchantments so you never underfill a soul gem, and unlike the original,
    has full support for trapping multiple souls at once, as well as never needing compatibility patches
    for other mods. For anyone who''s only ever played a stealth archer, this is the mod that finally
    makes magic tempting. It''s the kind of mod that quietly makes everything around it better. It''s
    the sort of thing that makes a pure mage run feel viable from level one all the way to the end. With
    well over 27 thousand endorsements, the community clearly agrees this one''s special.'
- kind: mod
  ref: 12
  narration: 'Then at number four: Mysticism - A Magic Overhaul by SimonMagus. Mysticism is a complete
    overhaul of Skyrim’s magic system designed to balance existing spells and add powerful new magical
    effects to the game. It''s lightweight, lore-friendly, and balanced, which is rarer than it should
    be in magic mods. It''s free, it''s polished, and it slots neatly into almost any load order. The
    spell effects are gorgeous too, so your screen actually looks like you''re casting real, dangerous
    magic. With well over 28 thousand endorsements, the community clearly agrees this one''s special.'
- kind: mod
  ref: 13
  narration: 'Number three: Odin - Skyrim Magic Overhaul by EnaiSiaion. Odin is what magic in Skyrim should
    have been. If you''ve ever felt like vanilla magic runs out of steam by mid-game, this is exactly
    the kind of mod that fixes it. Combined with the other picks on this list, it adds up to a dramatically
    better Skyrim. It slots cleanly alongside the other mods on this list, so you can stack them into
    one cohesive overhaul. With well over 29 thousand endorsements, the community clearly agrees this
    one''s special.'
- kind: mod
  ref: 14
  narration: 'At number two: Summermyst - Enchantments of Skyrim by EnaiSiaion. Summermyst adds over 100
    new enchantments to the game and the overhauls existing enchantments. The new enchantments are integrated
    seamlessly into the vanilla item system. It''s the sort of thing that makes a pure mage run feel viable
    from level one all the way to the end. If you somehow haven''t tried it yet, consider this your sign
    to fix that. For anyone who''s only ever played a stealth archer, this is the mod that finally makes
    magic tempting. With well over 51 thousand endorsements, the community clearly agrees this one''s
    special.'
- kind: mod
  ref: 15
  narration: 'And finally, the number one pick on the whole list: Apocalypse - Magic of Skyrim by EnaiSiaion.
    Apocalypse is the most popular Skyrim spell pack, adding 175 new spells that are unique, balanced,
    lore friendly, use high quality custom visuals and blend seamlessly into the vanilla magic system.
    The spell effects are gorgeous too, so your screen actually looks like you''re casting real, dangerous
    magic. It''s stable, well-supported, and beloved for good reason. It''s lightweight, lore-friendly,
    and balanced, which is rarer than it should be in magic mods. With well over 154 thousand endorsements,
    the community clearly agrees this one''s special. Honestly, if you only install one mod from this
    entire video, make it this one — it''s the perfect note to end on.'
- kind: outro
  narration: And that's the list — 15 of the best magic mods in 2026. Every mod is linked below with full
    credit to the brilliant authors who made them, so go show them some love. If this helped you out,
    subscribe, because I put out two new Skyrim modding videos every single week. Thanks so much for watching,
    and I'll see you in the next one.
