hook_line: Best New Lands & Quest Mods
description: 'Even MORE Insane Skyrim New Lands Mods — My Top 16 (Part 8)


  The very best new lands mods you can play in 2026, counted down from 16 to 1. Every mod is linked below
  with full credit to its author — go endorse them!'
tags:
- skyrim
- skyrim mods
- new_lands
- best skyrim mods
- '2026'
segments:
- kind: hook
  narration: We're back — and this time it's part 8. You loved the last round so much that I went digging
    for 16 more of the very best new lands mods Skyrim has to offer, and honestly, some of these might
    be even better than before. Every one is free, every author is linked below, and the number one pick
    is a must-have. Let's get into it.
- kind: intro
  narration: Before we dive in — every mod is free, every author is linked below, and a quick endorsement
    on Nexus genuinely helps these creators keep going. Alright, counting down from sixteen to one. Let's
    do it.
- kind: mod
  ref: 1
  narration: 'Number sixteen on the list: Temple of Agmer by venjhammet. Deep within the forsaken mine
    lies an ancient Nordic temple. Agmer, a once-mighty necromancer, sought lichdom and struck a perilous
    pact with the formidable Dremora Valzur to attain his dark ambition. If you''ve already cleared every
    vanilla dungeon twice, this is exactly the fresh content you''re craving. For anyone who plays Skyrim
    for the journey and the discovery, this is essential. If you somehow haven''t tried it yet, consider
    this your sign to fix that.'
- kind: mod
  ref: 2
  narration: 'At number fifteen: Ultimate Boss Fight Mod by LordMala. A total overhaul of all of Skyrim''s.
    Anyone who plays Skyrim mainly for the questing and the stories is going to be thrilled with this.
    It drops in seamlessly, so you can stumble into the adventure right in your current save. For what
    it''s worth, it''s pulled in more than 680 thousand downloads. This is one of those installs you''ll
    keep in every single playthrough.'
- kind: mod
  ref: 3
  narration: 'Kicking off number fourteen: Brittleshin by snozz2004. Visual overhaul of Brittleshin Pass
    with increased NPC. If you''ve already cleared every vanilla dungeon twice, this is exactly the fresh
    content you''re craving. It''s the kind of adventure that makes Skyrim feel enormous all over again.
    To put that in perspective, it''s pulled in more than 624 thousand downloads. This is one of those
    installs you''ll keep in every single playthrough.'
- kind: mod
  ref: 4
  narration: 'At number thirteen: Additional Cave by puratina. Add the 20 new dungeon to Skyrim. New dungeon
    corresponds to the Radiant Quest of vanilla. And it''s not just me who rates it — it''s a genuine
    classic that''s been going strong since 2016. This one''s for the explorers — the players who fast-travel
    the least and wander the most. If you''ve explored every inch of vanilla Skyrim, this is exactly the
    fix you need. It''s stable, well-supported, and beloved for good reason.'
- kind: mod
  ref: 5
  narration: 'Number twelve: White River Watch by snozz2004. A visual overhaul of the interior & exterior
    of White River Watch with increased NPC. If you''ve explored every inch of vanilla Skyrim, this is
    exactly the fix you need. This one''s for the explorers — the players who fast-travel the least and
    wander the most. The numbers back it up: the author is still actively updating it, with a patch as
    recent as April 2025. This is one of those installs you''ll keep in every single playthrough.'
- kind: mod
  ref: 6
  narration: 'Sliding in at number eleven: New Lore-Friendly Dungeons by GOOGLEPOX. Tired of the same
    old dwemer and nordic ruins? Time to add some more variety! This one''s for the explorers — the players
    who fast-travel the least and wander the most. And it''s not just me who rates it — it''s a genuine
    classic that''s been going strong since 2018. For anyone who plays Skyrim for the journey and the
    discovery, this is essential. If you somehow haven''t tried it yet, consider this your sign to fix
    that.'
- kind: mod
  ref: 7
  narration: 'Kicking off number ten: The Ruins of Mharzurk by venjhammet. During the 2nd Era a savant
    scholar left Clockwork City in search for the Ruins of Mharzurk. It was said that this scholar carried
    with him a powerful relic, a gift from Sotha Sil who later vanished in the depths of the ruin. This
    one''s for the explorers — the players who fast-travel the least and wander the most. And it''s not
    just me who rates it — it''s pulled in more than 139 thousand downloads. For anyone who plays Skyrim
    for the journey and the discovery, this is essential.'
- kind: mod
  ref: 8
  narration: 'Sliding in at number nine: The Cause - Reduced Cut by TateTaylorOH. Removes the Cause questline
    while retaining the rest of the new content. Anyone who plays Skyrim mainly for the questing and the
    stories is going to be thrilled with this. To put that in perspective, it''s pulled in more than 456
    thousand downloads. Whole new places to explore means dozens of fresh hours added to your playthrough.
    It''s the kind of mod that quietly makes everything around it better.'
- kind: mod
  ref: 9
  narration: 'Next up, number eight: Redoran''s Retreat by snozz2004. An overhaul of the interior & exterior
    of Redoran''s Retreat with increased NPC. For what it''s worth, it''s been downloaded over 1 million
    times. It drops in seamlessly, so you can stumble into the adventure right in your current save. Anyone
    who plays Skyrim mainly for the questing and the stories is going to be thrilled with this. It''s
    free, it''s polished, and it slots neatly into almost any load order.'
- kind: mod
  ref: 10
  narration: 'Coming in at number seven: Embershard by snozz2004. Exterior & Interior overhaul of Embershard
    Mine with increased Guard. This one''s for the explorers — the players who fast-travel the least and
    wander the most. The numbers back it up: it''s pulled in more than 744 thousand downloads. Whole new
    places to explore means dozens of fresh hours added to your playthrough. It''s the kind of mod that
    quietly makes everything around it better.'
- kind: mod
  ref: 11
  narration: 'Number six: Miyaps Dungeon Mod by miyaps00. This mod adds a new world called "Distant Ocean
    Isles" and dungeon. The world-building and atmosphere here genuinely rival the base game''s best moments.
    This one''s for the explorers — the players who fast-travel the least and wander the most. The numbers
    back it up: the author is still actively updating it, with a patch as recent as July 2025. Combined
    with the other picks on this list, it adds up to a dramatically better Skyrim.'
- kind: mod
  ref: 12
  narration: 'Number five: Caves of Morrowind by Speedygun1. Journey to the Velothi Mountains to uncover
    a Dunmer smuggling operation. Whole new places to explore means dozens of fresh hours added to your
    playthrough. If you''ve already cleared every vanilla dungeon twice, this is exactly the fresh content
    you''re craving. It''s free, it''s polished, and it slots neatly into almost any load order.'
- kind: mod
  ref: 13
  narration: 'At number four: Taarengrav Barrow by Penrutet. A vanilla-style nordic dungeon in the Western
    Rift, based on its appearance in the Elder Scrolls Online. The numbers back it up: it''s pulled in
    more than 792 thousand downloads. If you''ve already cleared every vanilla dungeon twice, this is
    exactly the fresh content you''re craving. Whole new places to explore means dozens of fresh hours
    added to your playthrough. It''s the kind of mod that quietly makes everything around it better.'
- kind: mod
  ref: 14
  narration: 'Kicking off number three: Morihaus'' Refuge - Lord''s Mail Reintegration by Jelidity. Changes
    the Lord''s Mail''s integration by removing the existing quest and instead adding an entirely new
    dungeon and equipping its boss with the Lord''s Mail for a challenging fight to acquire it. If you''ve
    already cleared every vanilla dungeon twice, this is exactly the fresh content you''re craving. Whole
    new places to explore means dozens of fresh hours added to your playthrough. And it''s not just me
    who rates it — it''s been downloaded over 1 million times.'
- kind: mod
  ref: 15
  narration: 'Then at number two: Ruined Temple of Phynaster - Encore by TwinCrows. A Snow Elf shrine
    to Phynaster, now inhabited by hostile Falmer. The blessing of Phynaster remains for those brave enough
    to reclaim the shrine. The world-building and atmosphere here genuinely rival the base game''s best
    moments. To put that in perspective, it''s a genuine classic that''s been going strong since 2017.
    Anyone who plays Skyrim mainly for the questing and the stories is going to be thrilled with this.
    It''s stable, well-supported, and beloved for good reason.'
- kind: mod
  ref: 16
  narration: 'And finally, my number one pick on the whole list: Lost Passages - New Dungeons for Skyrim
    by HeraclesJones. Adds 20 Radiant-enabled dungeons to various holds throughout Skyrim. It drops in
    seamlessly, so you can stumble into the adventure right in your current save. If you''ve already cleared
    every vanilla dungeon twice, this is exactly the fresh content you''re craving. For what it''s worth,
    it''s pulled in more than 706 thousand downloads. If you install one single mod from this entire video,
    make it this one — it earns the top spot.'
- kind: outro
  narration: So there you go — 16 new lands mods that'll seriously transform your game, all free and all
    linked below. Drop a comment with the one you'd have put at number one, hit subscribe for two new
    Skyrim videos a week, and I'll catch you in the next one.
