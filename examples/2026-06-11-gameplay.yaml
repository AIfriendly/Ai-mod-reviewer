segments:
- kind: hook
  narration: Skyrim is over a decade old, but thanks to its modding community it has never looked or played
    better — especially when it comes to gameplay mods. Today I'm counting down 15 of the absolute best
    gameplay mods you can install right now, all of them free, all of them linked down below. Stick around
    to the end, because the number one pick is the one I genuinely couldn't play without. Let's jump in.
- kind: intro
  narration: 'Quick note before we start: everything here is completely free on Nexus Mods, and every
    creator is credited in the description, so please go endorse their work — it''s the least we can do
    for this much free content. We''re counting down from number fifteen all the way to number one, so
    settle in. Here we go.'
- kind: mod
  ref: 1
  narration: 'Number fifteen: Wildcat - Combat of Skyrim by EnaiSiaion. Wildcat is a streamlined, yet
    full featured combat overhaul. It makes combat more dangerous and visceral by increasing lethality,
    adding injuries and context sensitive stagger and making combat AI more responsive and aggressive.
    It''s one of those changes you won''t be able to play without once you''ve felt the difference. Combined
    with the other picks on this list, it adds up to a dramatically better Skyrim. If your last playthrough
    started to feel stale, this is the mod that makes the world feel alive again. With well over 50 thousand
    endorsements, the community clearly agrees this one''s special.'
- kind: mod
  ref: 2
  narration: 'At number fourteen: Hearthfire multiple adoptions - Now with custom home support for kids
    and spouse by TMPhoenix. Allows adoption of up to 6 kids, instead of just 2Move your family into suitable
    custom homesGives children a last. It fixes something the base game got wrong in a way that feels
    completely natural, never intrusive. If you somehow haven''t tried it yet, consider this your sign
    to fix that. It''s the kind of deep, systemic improvement that you stop noticing precisely because
    it just feels right. With well over 52 thousand endorsements, the community clearly agrees this one''s
    special.'
- kind: mod
  ref: 3
  narration: 'Coming in at number thirteen: True Directional Movement - Modernized Third Person Gameplay
    by Ershin. Overhauls the third person gameplay similarly to modern action RPGs, entirely through SKSE.
    Move and attack in any direction. It works beautifully with the other picks here, so together they
    basically rebuild the moment-to-moment experience. It''s stable, well-supported, and beloved for good
    reason. Lightweight, stable, and endlessly compatible, it''s an easy recommendation for any load order.
    With well over 60 thousand endorsements, the community clearly agrees this one''s special.'
- kind: mod
  ref: 4
  narration: 'Next up, number twelve: Realistic Lighting Overhaul by sydney666. Realistic Lighting Overhaul
    is here! Ready for Skyrim Special Edition! This is a massive overhaul of Skyrim''s lighting. Exteriors
    also vastly overhauled! If your last playthrough started to feel stale, this is the mod that makes
    the world feel alive again. This is one of those installs you''ll keep in every single playthrough.
    It''s one of those changes you won''t be able to play without once you''ve felt the difference. With
    well over 60 thousand endorsements, the community clearly agrees this one''s special.'
- kind: mod
  ref: 5
  narration: 'Number eleven on the list: Realistic Ragdolls and Force by dDefinder. (ESP plugin)Reduces
    the extra force applied on ragdolls to a more reasonable level(MESH)Replaces ragdolls so that they
    bend and twist realistically and fall at. It''s the kind of deep, systemic improvement that you stop
    noticing precisely because it just feels right. It''s the kind of mod that quietly makes everything
    around it better. It fixes something the base game got wrong in a way that feels completely natural,
    never intrusive. With well over 61 thousand endorsements, the community clearly agrees this one''s
    special.'
- kind: mod
  ref: 6
  narration: 'Then at number ten: VioLens - A Killmove Mod by lRekol. SkyUI & SKSE64 Required. VioLens
    - A Killmove Mod gives you in-game control over both Ranged and Melee Killmoves. JContainers SE only
    required for use of the Profile System. Lightweight, stable, and endlessly compatible, it''s an easy
    recommendation for any load order. It''s free, it''s polished, and it slots neatly into almost any
    load order. It works beautifully with the other picks here, so together they basically rebuild the
    moment-to-moment experience. With well over 75 thousand endorsements, the community clearly agrees
    this one''s special.'
- kind: mod
  ref: 7
  narration: 'Number nine: Stones of Barenziah Quest Markers by toaDime. Adds quest markers to all 24
    of the Stones of Barenziah (Unusual Gems) that you need to find/collect for the "No Stone Unturned"
    quest. It''s one of those changes you won''t be able to play without once you''ve felt the difference.
    Combined with the other picks on this list, it adds up to a dramatically better Skyrim. If your last
    playthrough started to feel stale, this is the mod that makes the world feel alive again. With well
    over 81 thousand endorsements, the community clearly agrees this one''s special.'
- kind: mod
  ref: 8
  narration: 'At number eight: Wet and Cold by StepModifications. This mod adds weather-dependent visual
    effects and AI enhancements to the player and NPCs. It fixes something the base game got wrong in
    a way that feels completely natural, never intrusive. If you somehow haven''t tried it yet, consider
    this your sign to fix that. It''s the kind of deep, systemic improvement that you stop noticing precisely
    because it just feels right. With well over 81 thousand endorsements, the community clearly agrees
    this one''s special.'
- kind: mod
  ref: 9
  narration: 'Coming in at number seven: Run For Your Lives by Arthmoor. A small mod that makes citizens
    in a village or city run indoors during a dragon attack. It works beautifully with the other picks
    here, so together they basically rebuild the moment-to-moment experience. It''s stable, well-supported,
    and beloved for good reason. Lightweight, stable, and endlessly compatible, it''s an easy recommendation
    for any load order. With well over 83 thousand endorsements, the community clearly agrees this one''s
    special.'
- kind: mod
  ref: 10
  narration: 'Next up, number six: Cutting Room Floor by Arthmoor. A mod to restore several pieces of
    cut content in Skyrim Special Edition. If your last playthrough started to feel stale, this is the
    mod that makes the world feel alive again. This is one of those installs you''ll keep in every single
    playthrough. It''s one of those changes you won''t be able to play without once you''ve felt the difference.
    With well over 109 thousand endorsements, the community clearly agrees this one''s special.'
- kind: mod
  ref: 11
  narration: 'Number five on the list: Immersive Patrols SE by Scrabbulor. Immersive Patrols adds Stormcloak,
    Thalmor, Imperial and Dawnguard patrols to Skyrim and a few roaming Skaal, Reaver and Rieklings to
    Solstheim. These patrols can cross paths with eachother or the player creating new encounters. It''s
    the kind of deep, systemic improvement that you stop noticing precisely because it just feels right.
    It''s the kind of mod that quietly makes everything around it better. It fixes something the base
    game got wrong in a way that feels completely natural, never intrusive. With well over 124 thousand
    endorsements, the community clearly agrees this one''s special.'
- kind: mod
  ref: 12
  narration: 'Then at number four: Relationship Dialogue Overhaul - RDO by cloudedtruth. Adds over 5,000
    lines of completely voiced dialogue for NPCs using the original voices. Friends, followers, spouses,
    rivals, and others have much more to say. All default voices now have follower dialogue. Lightweight,
    stable, and endlessly compatible, it''s an easy recommendation for any load order. It''s free, it''s
    polished, and it slots neatly into almost any load order. It works beautifully with the other picks
    here, so together they basically rebuild the moment-to-moment experience. With well over 137 thousand
    endorsements, the community clearly agrees this one''s special.'
- kind: mod
  ref: 13
  narration: 'Number three: Ordinator - Perks of Skyrim by EnaiSiaion. Ordinator overhauls the perk trees
    of Skyrim to increase the depth and fun of character building. It is highly compatible with other
    mods and uses lightweight and clean scripting. It''s one of those changes you won''t be able to play
    without once you''ve felt the difference. Combined with the other picks on this list, it adds up to
    a dramatically better Skyrim. If your last playthrough started to feel stale, this is the mod that
    makes the world feel alive again. With well over 187 thousand endorsements, the community clearly
    agrees this one''s special.'
- kind: mod
  ref: 14
  narration: 'At number two: Immersive Citizens - AI Overhaul by Shurah. Immersive Citizens - AI Overhaul
    is a mod whose purpose is to increase player in-game immersion by greatly improving Artificial Intelligence
    (AI) of friendly. It fixes something the base game got wrong in a way that feels completely natural,
    never intrusive. If you somehow haven''t tried it yet, consider this your sign to fix that. It''s
    the kind of deep, systemic improvement that you stop noticing precisely because it just feels right.
    With well over 202 thousand endorsements, the community clearly agrees this one''s special.'
- kind: mod
  ref: 15
  narration: 'And finally, the number one pick on the whole list: Alternate Start - Live Another Life
    by Arthmoor. Live Another Life provides an alternative means to start the game for those who do not
    wish to go through the lengthy intro sequence at Helgen. It works beautifully with the other picks
    here, so together they basically rebuild the moment-to-moment experience. It''s stable, well-supported,
    and beloved for good reason. Lightweight, stable, and endlessly compatible, it''s an easy recommendation
    for any load order. With well over 235 thousand endorsements, the community clearly agrees this one''s
    special. Honestly, if you only install one mod from this entire video, make it this one — it''s the
    perfect note to end on.'
- kind: outro
  narration: And that's the list — 15 of the best gameplay mods in 2026. Every mod is linked below with
    full credit to the brilliant authors who made them, so go show them some love. If this helped you
    out, subscribe, because I put out two new Skyrim modding videos every single week. Thanks so much
    for watching, and I'll see you in the next one.
