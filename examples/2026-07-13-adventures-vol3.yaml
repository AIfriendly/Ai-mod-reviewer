segments:
- kind: hook
  narration: Bethesda gave us one Skyrim, but modders keep smuggling in the quests and places it forgot
    — from a serial killer you can finally catch, to a ten-hour epic beyond the Sea of Ghosts. Today I've
    got twelve of the best free new-lands and quest mods of 2026, and my number one is an absolute legend.
    Let's get into it.
- kind: intro
  narration: Everything here is completely free on Nexus, and every creator is credited in the description
    below — so please go endorse their work. We're counting down from twelve to one. Let's go.
- kind: mod
  ref: 1
  title: Additional Starts for Live Another Life
  narration: 'Number twelve: Additional Starts for Live Another Life, by MMX452. Live Another Life changed
    how a lot of us begin Skyrim — skipping that cart ride for a start of your choosing. This expands
    it with a fresh selection of new alternate starts, giving you even more ways to open your story, and
    it supports Alternate Perspective too. It''s a small add-on with a big impact on replayability. Number
    eleven lets you tell a Daedric Prince: no thanks.'
- kind: mod
  ref: 2
  title: No to Nocturnal
  narration: 'At number eleven: No to Nocturnal, by soupdragon. The Thieves'' Guild questline forces your
    character to swear a binding oath to the Daedric Prince Nocturnal, with no way to refuse. This finally
    gives you the choice — turn the oath down, and still finish the questline and become Guild Master
    on your own terms. For anyone roleplaying someone who answers to no Daedra, it''s the option Bethesda
    never wrote. Number ten lets you catch a killer before he strikes again.'
- kind: mod
  ref: 3
  title: Blood on the Ice Redux SE
  narration: 'Number ten: Blood on the Ice Redux, by ZZhukov. Windhelm''s serial-killer mystery is one
    of vanilla Skyrim''s most atmospheric quests — and also one of its most notoriously broken. This redux
    rebuilds it, fixes the triggers, and even lets you catch the Butcher before he kills again. It turns
    a buggy fan favorite into the murder investigation it was always meant to be. Number nine hands your
    character a reason to exist in the first place.'
- kind: mod
  ref: 4
  title: Why I Came to Skyrim - Origin Stories
  narration: 'At number nine: Why I Came to Skyrim, Origin Stories, by jayserpa — one of the most respected
    names in Skyrim questing. Ever notice your Dragonborn has no real reason for crossing into Skyrim?
    This adds forty possible new starting quests that give your character actual motivation and direction
    from the very first minutes. Instead of a blank slate, you begin with a purpose. It''s the quiet roleplay
    depth vanilla skips entirely. Number eight opens the doors of an ancient Dwemer wonder.'
- kind: mod
  ref: 5
  title: The Lost Wonders of Mzark
  narration: 'Number eight: The Lost Wonders of Mzark, by DarthVitrial — and it''s the only port of the
    classic Wonders of Mzark officially blessed by its original creator, Trainwiz. It expands the Dwemer
    ruin of Mzark into a sprawling, puzzle-filled wonderland of ancient machinery and secrets. If you
    love the Dwemer''s brass-and-steam mystery, this is a whole dungeon-sized love letter to it. Number
    seven takes you off the roads and straight up the mountains.'
- kind: mod
  ref: 6
  title: Ascend - Hidden Peaks of Skyrim
  narration: 'At number seven: Ascend, Hidden Peaks of Skyrim, also by jayserpa. This one turns Skyrim''s
    mountains themselves into the challenge. Climb your way up ten hidden peaks, let the wind guide you
    to each summit, and meditate at the very top for a reward. It''s part exploration, part quiet meditation,
    and a completely fresh way to experience a landscape you thought you already knew. Sometimes the only
    way left to go is up. Number six drags you down into an underground swamp.'
- kind: mod
  ref: 7
  title: Heart of the Reach - New Quest -  Dungeon - Weapons - 3 Creature Variants - Ring - Spell
  narration: 'Number six: Heart of the Reach, by TheLootist. Delve into the depths of an underground swamp
    to aid a priest and heal the Heart of the Reach — a self-contained package with a new quest, a new
    dungeon, custom weapons, three new creature variants, a ring, and a spell. It''s compact but genuinely
    complete, dropping a whole new corner of the world in beneath your feet. Number five is a fully voiced
    quest as strange as it is memorable.'
- kind: mod
  ref: 8
  title: Quest - Baba Yaga and the Labyrinth
  narration: 'At number five: Baba Yaga and the Labyrinth, by the legendary wSkeever. This fully voiced
    quest sends you after the mysteries of a walking hut, a maze inside the Soul Cairn, weeping angels,
    and a witch straight out of folklore. It''s weird, it''s genuinely unsettling, and it''s the kind
    of imaginative one-off only the very best modders pull off. If you want a quest that actually surprises
    you, this is it. Number four pulls you inside the pages of a forbidden book.'
- kind: mod
  ref: 9
  title: The Tale of Tsatampra Xiros
  narration: 'Number four: The Tale of Tsatampra Xiros, by SlimeSire. This sends you into a world contained
    within the pages of a sorcerous text, to earn the favor of Hermaeus Mora, the Daedric Prince of forbidden
    knowledge. It''s a surreal, self-contained realm all its own, dripping with eldritch atmosphere. Exploring
    somewhere that exists inside a book is exactly the sort of magic modding does best. Number three takes
    you beyond Skyrim entirely, out across the Sea of Ghosts.'
- kind: mod
  ref: 10
  title: The Grand Paladin - 2021 (Remake)
  narration: 'At number three: The Grand Paladin, by Kittytail. Venture beyond Skyrim''s borders, into
    the mists of the Sea of Ghosts, and uncover the legacy of an ancient order of Dragonborn. It''s a
    full new-lands adventure from one of the most trusted quest authors around, with a whole hidden region
    and a story to work through. Sailing off the edge of the known map never gets old. Number two is a
    ten-hour epic that plays like an official expansion.'
- kind: mod
  ref: 11
  title: (OLD) Death Consumes All - DLC-Long Quest Mod
  narration: 'Number two: Death Consumes All, by anbeegod. This is a ten-hour, fully voiced, narrative-driven
    questline openly inspired by The Witcher Three''s Hearts of Stone — and it genuinely earns the comparison.
    A plague has risen, and the story that unfolds is darker and more mature than almost anything in the
    base game. It''s less a mod and more a full expansion''s worth of writing and voice acting. If you
    want a quest that stays with you, this is it. And my number one is one of the most legendary quest
    mods ever made.'
- kind: mod
  ref: 12
  title: The Gray Cowl of Nocturnal - 10th anniversary
  narration: 'And my number one: The Gray Cowl of Nocturnal, now in its tenth-anniversary edition, by
    mannygt. This is a genuine epic. It follows the fabled Gray Cowl, last worn by the Champion of Cyrodiil,
    and sends you far beyond Skyrim into a massive new region with its own city, its own dungeons, and
    a sprawling questline. A full decade of updates have made it one of the most polished and beloved
    adventure mods ever released. If you play one single thing from this list, make it this. That''s my
    top twelve — every mod is linked below, so go endorse these authors. They''ve earned it.'
- kind: outro
  narration: That's the list — twelve of the best Skyrim new-lands and quest mods in 2026. Every one is
    linked below with full credit to the authors who built them, so go show them some love. If this helped
    you out, subscribe — two new Skyrim videos every week. Thanks for watching, I'll see you in the next
    one.
