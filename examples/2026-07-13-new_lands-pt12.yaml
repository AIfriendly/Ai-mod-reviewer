slug: 2026-07-13-new_lands-pt12
title: 10 MORE Skyrim New Lands Mods You Probably Missed (Vol. 12)
category_id: new_lands
format: category_list
hook_line: Best New Lands Mods
description: Ten more new lands, islands and hidden worlds for Skyrim in 2026, counted down from 10 to
  1. Every mod is free and linked below — go endorse the authors!
tags:
- skyrim new lands mods
- skyrim new worldspace
- skyrim dlc mods
- skyrim exploration
- skyrim mods 2026
- skyrim island mods
segments:
- kind: hook
  narration: Skyrim's borders have kept us fenced in for over a decade, but modders keep tearing holes
    in the map, floating islands, lost outposts, whole slices of Morrowind and Cyrodiil. Here are ten
    more new lands you probably missed, and the one at number one finally lets you walk through those
    locked border gates. Let's explore.
- kind: intro
  narration: Every one of these adds a fresh place to your current save, all free on Nexus with the creators
    credited below, so please go endorse their work. Counting down from ten to one, here we go.
- kind: mod
  ref: 1
  narration: 'Number ten: Silgrad, the Great Valley of Morrowind by the author behind a string of Dunmeri
    town mods. If you love Morrowind''s culture but every port attempt feels empty and unfinished, Silgrad
    is a labor of love that actually builds it out, a new land packed with hand-made Dunmer settlements,
    mushroom architecture and that unmistakable ashen atmosphere. The care shows in the towns, they feel
    designed by someone genuinely obsessed with getting Morrowind right. It''s a newer, growing project
    so expect a little rough edge here and there, but as a fresh slice of Morrowind to wander, it''s a
    great start to the list. Let''s stay in Solstheim''s neighbourhood for the next one.'
- kind: mod
  ref: 2
  narration: At number nine, Morrowind's Bloodmoon Solstheim Content by the author restoring the old island's
    glory. Here's the itch it scratches, if you played Morrowind's Bloodmoon expansion, Skyrim's version
    of Solstheim always felt a little bare by comparison, missing chunks of the cool stuff you remembered.
    This mod pulls that content back in, adding locations and details inspired by the original Bloodmoon
    so the island feels fuller and more faithful. It's really one for the lore nostalgics, a love letter
    to old Solstheim rather than a flashy standalone. If that's you, it's a lovely addition. Now let's
    get properly weird with a floating world.
- kind: mod
  ref: 3
  narration: 'Number eight: Dark Glade by the modder chasing something surreal. Skyrim is grounded, muddy
    boots and cold stone, and sometimes you want somewhere that feels like a dream instead. Dark Glade
    is a brand-new worldspace of several floating islands suspended in an eerie void, a genuinely striking
    change of scenery you won''t find anywhere in the base game. The visual identity is the whole appeal,
    drifting between islands in the sky is exactly the kind of otherworldly moment mods are perfect for.
    It''s a compact, atmosphere-first location rather than a huge questline, so treat it as a beautiful
    place to visit, not a hundred-hour epic. Speaking of dreamlike, our next stop is straight out of another
    game entirely.'
- kind: mod
  ref: 4
  narration: Coming in at number seven, the Temple of Time and Kokiri's Valley by the Zelda-loving team
    behind it. Every Nintendo kid has thought it, why can't Skyrim feel a little like Ocarina of Time?
    This mod answers directly, recreating the Temple of Time and the Kokiri Forest as an explorable new
    area, lovingly rebuilt in Skyrim's engine. It's pure nostalgia done with real affection, and stepping
    into that green, peaceful valley hits different if you grew up with the original. Obviously it's a
    crossover fantasy rather than lore-friendly Tamriel, so it won't suit a strict roleplay run, but as
    a joyful detour it's wonderful. Back to the Sea of Ghosts for number six.
- kind: mod
  ref: 5
  narration: At number six, Windfall Island by the author porting it to Special Edition. Skyrim's coastline
    is gorgeous but weirdly empty out on the water, all that sea and almost nowhere to actually land.
    Windfall Island drops a charming, self-contained little island out there for you to discover and make
    your own, a cozy new spot with its own character away from the mainland bustle. The appeal is simplicity,
    it's a neat, hand-made getaway rather than a sprawling questline, the sort of place you sail to and
    just enjoy. It keeps things lightweight and compatible, which is refreshing. Next, a tiny outpost
    with a big view.
- kind: mod
  ref: 6
  narration: 'Number five: Ysmir''s Tear, the Last Bastion of the North by its author. The far northern
    reaches of Skyrim''s map are pure blank ocean, you sail out expecting something and find nothing.
    Ysmir''s Tear plants an old dockmaster''s post out in the frigid Sea of Ghosts, a weathered little
    bastion guarding the bitter north with its own history and characters to meet. What makes it click
    is the mood, a lonely, storm-battered outpost at the edge of the world is exactly the kind of evocative
    spot vanilla forgets to build. It''s small and focused rather than a full land, but it adds real texture
    to that empty northern sea. Now let''s find somewhere a little more peaceful.'
- kind: mod
  ref: 7
  narration: At number four, The Valley of Peace by its long-time author. After the hundredth bandit ambush,
    sometimes you just want a corner of Skyrim that isn't trying to murder you. The Valley of Peace is
    exactly that, a tranquil hidden valley built as a serene retreat and home, tucked away from the chaos,
    with its own gentle scenery to settle into. The whole point is the calm, it's designed as a place
    to breathe, take screenshots, and roleplay a quieter life between adventures. It's kept updated and
    easy to drop in. If your Dragonborn needs a holiday, this is where they'd take it. Speaking of settling
    down, let's talk trade.
- kind: mod
  ref: 8
  narration: 'Number three: Solstheim Trading Posts by DemonLord7654, made in honour of Skyrim''s tenth
    anniversary. Solstheim is atmospheric but commercially dead, you can wander for ages without anywhere
    real to buy, sell or restock. This mod threads new trading posts across the island, giving Solstheim
    the sense of a working economy with merchants, goods and reasons to travel between them. It''s a smart
    bit of world-building, small in footprint but it makes the whole island feel more alive and connected.
    Don''t expect a grand questline, it''s an immersion and convenience mod at heart, and a genuinely
    useful one. Now for a proper archipelago.'
- kind: mod
  ref: 9
  narration: At number two, the Harthstone Isles by their author. We keep coming back to the Sea of Ghosts
    because it's such wasted space, endless water north of Winterhold with nothing on it. The Harthstone
    Isles fix a real chunk of that, adding a small explorable archipelago out in those icy waters, a scatter
    of islands with their own locations and secrets to uncover by boat. The exploration loop is the draw,
    hopping between wind-blasted little isles genuinely recaptures that early-game thrill of not knowing
    what's over the next rise. It's a tighter, focused new land rather than a mega-expansion, which honestly
    makes it easy to just drop in and enjoy. And finally, my number one, the biggest world of the bunch.
- kind: mod
  ref: 10
  narration: 'And finally, my number one on this list: Fat Skyrim, a worldspace expansion by vykaz. You''ve
    seen those border gates blocking the edges of the map, teasing Cyrodiil, Hammerfell, High Rock and
    Morrowind, and then locking you out forever. Fat Skyrim opens them, expanding the worldspace with
    new content in the regions behind every border gate, not the whole neighbouring provinces, but the
    frontier slices just past Skyrim''s edges. That premise is what earns the top spot, it makes Skyrim''s
    map feel like it actually continues rather than hitting an invisible wall, which is the single most
    immersion-breaking thing about the base game. It''s an ambitious, ongoing project so treat it as a
    growing frontier, but no other mod quite captures that thrill of finally stepping through the gate.
    Go and cross the border.'
- kind: outro
  narration: And that's another ten worlds to bolt onto your Skyrim, every one free and linked below.
    Tell me in the comments which one you're exploring first, hit subscribe for more, and I'll see you
    in the next one. Happy modding, everyone.
