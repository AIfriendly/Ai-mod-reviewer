segments:
- kind: hook
  narration: Skyrim hands you a few housecarls with four lines each and calls it a day. But modders have
    built companions with thousands of lines, full questlines, and actual personalities. Today I've got
    ten of the best free follower mods of 2026 — and my number one might be the best companion ever made
    for this game. Let's get into it.
- kind: intro
  narration: Everything here is completely free on Nexus, and every creator is credited in the description
    below — so please go endorse their work. We're counting down from ten to one. Let's go.
- kind: mod
  ref: 1
  title: Companions and Followers SE AE
  narration: 'Number ten: Companions and Followers, by Scrabbulor. Vanilla Skyrim is thin on people willing
    to travel with you — you''re mostly stuck with the housecarls. This scatters twelve new followers
    across the world, each with their own specialization, and they actually roam between locations instead
    of rooting to one tavern forever. It''s the simplest way to give yourself real options for who watches
    your back — no questlines, no fuss, just more choice. Number nine fixes the thing every vanilla follower
    does that breaks immersion the second you stop walking.'
- kind: mod
  ref: 2
  title: Followers can Relax
  narration: 'At number nine: Followers Can Relax, by KingCoin. It''s a Bethesda tradition — you walk
    into an inn and your follower just stands there, staring at a wall like a mannequin. This lets them
    actually live: wander the room, sit down, eat, drink, warm themselves by the fire. It''s a tiny change
    that makes your companion feel like a person instead of a bodyguard stuck on standby. Once you''ve
    seen it, you can''t go back to the vanilla version. Number eight takes one of the most famous followers
    in the game and finally gives her a voice worth listening to.'
- kind: mod
  ref: 3
  title: Improved Follower Dialogue - Lydia
  narration: 'Number eight: Improved Follower Dialogue for Lydia, by Roadhouse699. Everyone knows Lydia
    — and everyone''s heard her same four lines a thousand times. This brings in a genuinely talented
    new voice actor and over fourteen hundred lines of fresh dialogue, turning her from a sworn-to-carry-your-burdens
    meme into the character she always should have been. She reacts, she banters, she has opinions. It''s
    the glow-up Skyrim''s most iconic housecarl always deserved. Number seven finally lets you tell your
    followers exactly where to go.'
- kind: mod
  ref: 4
  title: My Home is Your Home
  narration: 'At number seven: My Home is Your Home, by FakeTails — the SSE version of Volek''s legendary
    original. Ever wanted to send a follower home instead of dragging them across the whole map? This
    lets you assign any follower a house, a job, patrol routes, even a bed — and they''ll genuinely live
    there. With over thirty-three thousand endorsements, it''s one of the most trusted follower tools
    ever made. It quietly turns your companions into actual residents of your world. Number six is the
    mod that finally lets you show them you care.'
- kind: mod
  ref: 5
  title: I'm Glad You're Here - a follower and spouse appreciation mod - SSE
  narration: 'Number six: I''m Glad You''re Here, by WhiteWolf. Skyrim lets you marry and adopt, but never
    actually lets you show any warmth to the people you''ve collected along the way. This fills that gap
    — fully voiced dialogue to thank your followers, your spouse, even your kids, complete with a hug
    animation. It sounds small, but it''s an emotional beat the base game is completely missing, and it
    makes your home feel like a home. Number five is where the custom voiced questing followers begin
    — starting with an Orc out for revenge.'
- kind: mod
  ref: 6
  title: (NEW) Thogra gra-Mugur - Orc Follower and Quest
  narration: 'At number five: Thogra gra-Mugur, an Orc follower and quest, by damakarmelowa — re-released
    with a brand-new voice. Thogra is an Orc widow, and helping her hunt down the one who wronged her
    is a proper little questline attached to a companion who has a real reason to travel with you. It''s
    personal, it''s fully voiced, and it''s got the kind of grounded story vanilla followers never get.
    Number four is a full custom follower who can also quietly replace one you already know.'
- kind: mod
  ref: 7
  title: Mare Follower or Lydia Replacer - High Poly Head - 4K FaceTint - ESL
  narration: 'Number four: Mare, by CoralineKoralina — a custom follower you can either add to the world
    or drop straight into Lydia''s slot as a replacer. She''s built with a high-poly head, four-K face
    textures, and she''s ESL-flagged, so she costs you nothing against your plugin limit. If you''ve ever
    wanted a better-looking, more detailed companion without bloating your load order, this is the clean
    way to do it. Number three grants one of the single most-requested wishes in all of Skyrim modding.'
- kind: mod
  ref: 8
  title: Marry Me Serana
  narration: 'At number three: Marry Me Serana, by Kevinsito. For over a decade, players finished Dawnguard,
    traveled all of Skyrim at Serana''s side, and then slammed into the game''s most infamous wall — you
    simply cannot marry her. This fixes exactly that: finish the quest Kindred Judgment, and you can finally
    settle down together. It''s a simple mod that scratches one of the oldest itches in the community,
    and with nearly seventeen thousand endorsements, you are clearly not the only one who wanted it. Number
    two is a companion the size of an official add-on.'
- kind: mod
  ref: 9
  title: Ashe - Crystal Heart
  narration: 'Number two: Ashe, Crystal Heart, by Martimius. This isn''t just a follower — it''s a DLC-sized
    journey, over three thousand lines of dialogue with real character development, and it was voted Mod
    of the Month when it dropped. Ashe brings her own story, her own arc, and enough writing to stand
    next to an official expansion. If you want a companion who feels like the lead of their own questline
    instead of a tag-along, this is it. And my number one is widely considered one of the greatest custom
    followers ever made for Skyrim.'
- kind: mod
  ref: 10
  title: Xelzaz - Custom Fully Voiced Argonian Telvanni Follower
  narration: 'And my number one: Xelzaz, the fully voiced Argonian Telvanni follower, by BluePwnsU. Xelzaz
    is a lawman of House Telvanni on his way to Rivenspire, and he ships with around eighty-five hundred
    lines of dialogue — banter, commentary, his own questline, and reactions to seemingly everything you
    do. He''s funny, he''s genuinely deep, and he set the standard that every custom follower since gets
    measured against. If you install only one companion from this whole list, make it this one. That''s
    my top ten — every mod is linked below, so go endorse these authors. They have more than earned it.'
- kind: outro
  narration: That's the list — ten of the best Skyrim follower mods in 2026. Every one is linked below
    with full credit to the authors who made them, so go show them some love. If this helped you out,
    subscribe — two new Skyrim videos every week. Thanks for watching, and I'll see you in the next one.
