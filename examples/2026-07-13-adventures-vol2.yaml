segments:
- kind: hook
  narration: Bethesda gave us one Skyrim, but modders keep smuggling in the places it forgot — hidden
    villages, whole new provinces, even Middle-earth itself. Today I've got twelve of the best free new-lands
    and adventure mods of 2026, and my number one is a full DLC-sized island. Let's explore.
- kind: intro
  narration: Everything here is completely free on Nexus, and every creator is credited in the description
    below — so please go endorse their work. We're counting down from twelve to one. Let's go.
- kind: mod
  ref: 1
  title: Stave Church of Skyrim
  narration: 'Number twelve: Stave Church of Skyrim, by RedBag. Skyrim''s architecture is gorgeous, but
    its actual places of worship are mostly small roadside shrines. This adds a beautiful wooden stave
    church — the kind you''d find in medieval Scandinavia — to your choice of seven optional spots around
    the map. It''s a small, atmospheric addition that drops a striking new landmark right into your world.
    Pick the location that fits your game and go. Number eleven climbs to one of the most scenic viewpoints
    a mod has ever added.'
- kind: mod
  ref: 2
  title: Shrine to Kyne
  narration: 'At number eleven: Shrine to Kyne, by Surjamte. High on a mountain peak above Windhelm, this
    places a traditional shrine to Kyne, the Nord goddess of the storm, with a climb and a view that turns
    it into a genuine pilgrimage. It''s less about loot and more about the journey up and the vista waiting
    at the top. If you play Skyrim for the quiet, breathtaking moments, this one is built for you. Number
    ten drops a cozy waypoint exactly where you always wished there was one.'
- kind: mod
  ref: 3
  title: The Crossroads Inn
  narration: 'Number ten: The Crossroads Inn, by Kursan. There''s a long, empty stretch where the road
    from Whiterun to Markarth crosses the path down to Lake Ilinalta, and nowhere at all to rest. This
    tucks a cozy little inn right at that crossroads, exactly where a weary traveler would want one. It''s
    the kind of lived-in detail that makes the world feel designed instead of empty — a warm bed and a
    fire in the middle of nowhere. Number nine builds a whole village where there used to be nothing but
    coastline.'
- kind: mod
  ref: 4
  title: SeaPoint Settlement
  narration: 'At number nine: SeaPoint Settlement, by LeianneH. This isn''t a single building — it''s
    an entire coastal village, with an inn, a bakery, a general store, stables, a smithy, an apothecary,
    a lighthouse, a fishery, and a player home with a bunkhouse for your followers. It even runs a weekly
    market. It turns an empty stretch of coast into a living, working community you can actually settle
    into. Number eight is a brand-new worldspace built purely to take your breath away.'
- kind: mod
  ref: 5
  title: Birthplace of a Kitsune - SE
  narration: 'Number eight: Birthplace of a Kitsune, by Shockero. Not every mod needs a questline — some
    just build somewhere beautiful. This is a hand-crafted new worldspace made for exploring, taking screenshots,
    and simply relaxing far from Skyrim''s endless dragon attacks. It''s a peaceful, almost otherworldly
    escape that exists for the pure joy of the view. Sometimes the best adventure is just somewhere new
    to breathe. Number seven hands you something no vanilla playthrough ever offers — your very own prison.'
- kind: mod
  ref: 6
  title: Dread Prison
  narration: 'At number seven: Dread Prison, by WhateverDev. Ever wished you could do something other
    than kill or ignore an annoying NPC? This gives you your own prison, south of Lake Ilinalta, and lets
    you drag almost anyone in Skyrim there and lock them away. It''s a genuinely unique piece of roleplay
    — a jailer fantasy the base game never even considered. Petty, powerful, and strangely satisfying.
    Number six is a full faction, guildhall, and questline rolled into one.'
- kind: mod
  ref: 7
  title: Order of Aetherius - School of Julianos - Mages Guild - Player Home - Followers
  narration: 'Number six: the Order of Aetherius, by Socalista. Sitting between Whiterun and Ivarstead,
    this adds a whole mages'' guildhall devoted to the School of Julianos — a faction to join, five followers,
    custom dialogue, its own miscellaneous quests, and a player home baked right in. It''s essentially
    a mini Mages College with more personality and an actual story. If Winterhold''s college always felt
    too thin, this is the guild experience it should have been. Number five packs the empty wilds with
    real danger.'
- kind: mod
  ref: 8
  title: Skyrim Bandit Expansion
  narration: 'At number five: Skyrim Bandit Expansion, by MissingLukey. Skyrim''s open country can feel
    bare between the big set-pieces. This adds fourteen new, hand-crafted bandit camps and two occupied
    mines across the map, all compatible with radiant quests — so your bounties and jobs suddenly have
    far more places to send you. Every location is built by hand, not copy-pasted. It makes the wilderness
    feel genuinely dangerous to cross again. Number four is over fifty new places, every one of them hidden
    off the beaten path.'
- kind: mod
  ref: 9
  title: Unmarked Locations Pack
  narration: 'Number four: the Unmarked Locations Pack, by GeraldMods. The best discoveries in Skyrim
    are the ones with no marker on your compass at all. This hand-places more than fifty new locations
    across the world — camps, ruins, hideaways, and little secrets — none of them marked, all of them
    waiting to be stumbled into. It rewards the exact kind of player who wanders off the road just to
    see what''s over the next hill. Number three drags an entire other legendary world into Skyrim.'
- kind: mod
  ref: 10
  title: The Elder Scrolls V MIDDLE-EARTH Redone SSE
  narration: 'At number three: The Elder Scrolls Five, Middle-Earth Redone, by FoNV4. This is every bit
    as ambitious as it sounds — it brings Tolkien''s Middle-earth, the world of The Lord of the Rings,
    into Skyrim, with many locations to explore, and it''s still actively growing. You can wander straight
    out of the Nordic tundra and into the landscapes of Middle-earth. For a certain kind of fan, that
    is an absolute dream crossover. Number two takes you somewhere the Elder Scrolls has only ever teased
    — Valenwood.'
- kind: mod
  ref: 11
  title: Elden Root - A Tale Of Valenwood
  narration: 'Number two: Elden Root, A Tale of Valenwood, by arminZX. Valenwood, the forest home of the
    Bosmer, has never been a playable province in a mainline Elder Scrolls game. After six months of work,
    this mod''s first release takes you to the city of Elden Root, deep in that jungle canopy. It''s a
    rare chance to actually visit somewhere the lore has talked about for decades but never shown you.
    Exploring a whole new province hits completely different. And my number one is a full DLC-sized new
    land, questline and all.'
- kind: mod
  ref: 12
  title: Olenveld
  narration: 'And my number one: Olenveld, by ForceField. This is the real deal — a new-lands mod the
    size of a small DLC, bringing the lore-rich island of Olenveld to Skyrim, complete with its own unique
    questline and an entire island to uncover. It''s the kind of hand-built, story-driven destination
    that feels like official content Bethesda simply never got around to making. If you install one thing
    from this whole list, make it this. That''s my top twelve — every mod is linked below, so go endorse
    these authors. They have more than earned it.'
- kind: outro
  narration: That's the list — twelve of the best Skyrim new-lands and adventure mods in 2026. Every one
    is linked below with full credit to the authors who built them, so go show them some love. If this
    helped you out, subscribe — two new Skyrim videos every week. Thanks for watching, and I'll see you
    in the next one.
