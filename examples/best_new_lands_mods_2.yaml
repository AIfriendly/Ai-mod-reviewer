title: 12 MORE Skyrim New Lands Mods You NEED to Play! (Part 2)
category_id: new_lands
format: category_list
hook_line: 12 MORE New Skyrim Worlds
description: Part 2! Twelve more incredible new lands and quest mods for Skyrim, including award-winning
  masterpieces. Every mod linked below, full credit to the authors.
segments:
- kind: hook
  narration: So you watched my last new lands video, you installed all twelve, and you've already burned
    through hundreds of hours? Unbelievable. Well, you're in luck, because the well is nowhere near dry.
    Skyrim's modding community has built so many incredible new worlds, hidden cities, and epic questlines
    that I needed a whole second video just to cover the next twelve. We've got award-winning masterpieces,
    massive new worldspaces, and a few hidden gems almost nobody talks about. This is New Lands, Part
    Two, and trust me, number one might just be the single best Skyrim mod ever made. Let's get into it.
- kind: intro
  narration: Same deal as always — every single mod here is completely free on Nexus Mods, every creator
    is linked down in the description, and you should absolutely take ten seconds to go and endorse them,
    because these projects represent thousands of hours of unpaid passion. We're counting down once again
    from number twelve all the way up to number one. So get comfortable, because your already-impossible
    backlog is about to get even worse. Here we go.
- kind: mod
  ref: 1
  narration: 'Kicking off Part Two at number twelve: Here There Be Monsters by the Modder''s Guild. Ever
    feel like Skyrim''s seas and coastlines were a little... empty? This mod fixes that by adding a whole
    bestiary of legendary aquatic monsters — krakens, sea serpents, giant beasts lurking beneath the waves
    — along with hunts to track them down. It turns the ocean and rivers into genuinely dangerous, exciting
    territory to explore, complete with new locations and rewards. If you want the world beyond the shoreline
    to finally feel alive and threatening, this is a brilliant, atmospheric addition that most players
    completely overlook.'
- kind: mod
  ref: 2
  narration: 'At number eleven: The Flying Knight. This is a fully voiced, story-driven quest mod that''s
    earned a devoted following for its surprisingly heartfelt writing and its memorable, fleshed-out companion
    character. Without spoiling anything, it sends you on a personal, emotional journey with real stakes
    and genuinely good production values from start to finish. It''s the kind of hidden gem that doesn''t
    have a million endorsements yet, but absolutely deserves your attention if you love character-driven
    adventures. Give it a shot — it''ll surprise you.'
- kind: mod
  ref: 3
  narration: 'Number ten: Haafstad and the Border of High Rock by Soldierofwar. This is part of an incredible
    trilogy of border-region mods, each one opening up a brand-new explorable area along Skyrim''s edges.
    Haafstad adds a whole new settlement and surrounding wilderness on the border with High Rock, packed
    with quests, NPCs, shops, and places to discover. It feels like a natural, lore-friendly extension
    of the base map rather than something bolted on. If you''ve ever looked at Skyrim''s borders and wished
    you could just keep walking, this trilogy is exactly what you''ve been waiting for.'
- kind: mod
  ref: 4
  narration: 'At number nine: Folkstead and the Border of Hammerfell, also by Soldierofwar. The second
    entry in that border trilogy takes you to the edge of Hammerfell, with a new town, fresh quests, and
    a distinct frontier atmosphere all its own. What I love about these mods is how seamlessly they blend
    into the existing world — they expand Skyrim outward in a way that feels completely believable. New
    people to meet, new problems to solve, and new corners of the map to call your own. Cozy, immersive,
    and genuinely expansive exploration.'
- kind: mod
  ref: 5
  narration: 'Number eight: Nyhus and the Border of Cyrodiil, the third piece of Soldierofwar''s border
    trilogy. This one opens the southern border with Cyrodiil, adding yet another settlement, more quests,
    and more reasons to wander off the beaten path. Installed together, these three mods ring the edges
    of Skyrim with new, living places to explore, effectively making the whole world feel bigger and more
    connected. They''re underrated, lightweight, and they scratch that explorer''s itch perfectly. If
    you run all three, your map suddenly has a whole new frontier.'
- kind: mod
  ref: 6
  narration: 'At number seven: Rigmor of Cyrodiil. This is the epic, full-blown sequel to Rigmor of Bruma,
    and if you played the first one, you already know you''re in for an emotional rollercoaster. The story
    continues on an even grander scale, taking you deep into Cyrodiil across a massive new region with
    cinematic set pieces, full voice acting, political intrigue, and genuinely gut-wrenching drama. It
    is enormous, it is ambitious, and it delivers one of the most complete, movie-like storytelling experiences
    available in any Skyrim mod. Play the first, then lose yourself completely in this one.'
- kind: mod
  ref: 7
  narration: 'Number six: The Gray Cowl of Nocturnal by mandril. This is a massive, DLC-sized adventure
    that whisks you away from the snow of Skyrim to the scorching deserts of the Alik''r and beyond, on
    a quest to recover the legendary Gray Cowl. It adds an entire sun-baked new worldspace that looks
    and feels nothing like the base game — a genuinely refreshing change of scenery — packed with dungeons,
    puzzles, platforming, and a great central story. It''s long, it''s polished, and that complete change
    of environment makes it feel like a true expansion. Highly recommended.'
- kind: mod
  ref: 8
  narration: 'At number five: Project AHO by the Wccc team. Short for the Aetherium Heavy Industries,
    this is one of the most acclaimed quest mods ever released. You''re abducted and taken to a hidden,
    enormous Dwemer city suspended in a pocket of reality, and what follows is a sprawling, brilliantly
    designed questline full of memorable characters, tough moral choices, and that unmistakable eerie
    Dwemer atmosphere. It''s roughly the size of an official DLC, it''s fully voiced, and the craftsmanship
    on display is genuinely staggering. If you love the Dwemer ruins in the base game, this turns that
    fascination up to eleven.'
- kind: mod
  ref: 9
  narration: 'Number four: The Choice is Yours by kryptopyr. Okay, this one is a little different — it''s
    not a new land, it''s the mod that makes every OTHER quest mod better. Vanilla Skyrim throws quests
    at you constantly, often starting them the instant you overhear a conversation. The Choice is Yours
    hands control back to you, letting you decide when and whether quests begin, so your journal stays
    clean and your roleplay stays intact. With this many huge questlines installed, it becomes absolutely
    essential for keeping your playthrough organized and intentional. A quiet must-have.'
- kind: mod
  ref: 10
  narration: 'At number three: VIGILANT by Vicn. This is, for many people, the
    single greatest quest mod ever made for Skyrim. From the creator of Glenmoril, VIGILANT is a sprawling,
    four-act dark fantasy epic following the Vigilants of Stendarr in their war against Molag Bal and
    the forces of Coldharbour. It''s got a stylized, almost anime-meets-Dark-Souls presentation, brutal
    boss fights, branching morality, and a story of genuine tragedy and depth. It is enormous, it is unforgettable,
    and it is completely free. If you only play one quest mod on this entire list, make it this one.'
- kind: mod
  ref: 11
  narration: 'At number two: Helgen Reborn by Mike Hancho. We all watched Helgen burn in the opening of
    the game — so why does it just sit there as a ruin forever? This classic, beloved mod lets you take
    part in rebuilding Helgen from the ashes into a thriving town, through a lengthy, fully voiced questline
    full of intrigue, arena battles, and memorable characters. It restores a piece of the world the base
    game left broken, and gives you a real sense of lasting impact. It''s polished, it''s satisfying,
    and it''s been an essential install for years for very good reason.'
- kind: mod
  ref: 12
  narration: 'And the number one mod everyone needs to experience: The Forgotten City by Modern Storyteller.
    This isn''t just a great Skyrim mod — it''s a genuine masterpiece. It''s a time-loop murder mystery
    set in an ancient, hidden Dwemer city governed by a single deadly rule, and your job is to unravel
    the truth before the cycle resets. The writing is so extraordinary it won a national award and was
    later remade into a fully standalone commercial game. Every choice matters, every character is brilliantly
    written, and the ending will stay with you for a long, long time. It is the gold standard for what
    a mod can be. Do not miss it.'
- kind: outro
  narration: And that's another twelve mods adding hundreds more hours of brand-new Skyrim. Between this
    and Part One, that's twenty-four incredible new worlds and questlines waiting for you. Every one is
    linked below with full credit to the brilliant authors, so please go endorse them. If you want a Part
    Three — and honestly, there's enough out there for it — let me know in the comments. Subscribe for
    two new Skyrim videos every single week, and I'll see you in the next one.
