segments:
- kind: hook
  narration: 'You asked for more, so here''s part 10: 10 more of the best new lands mods I could find,
    with zero repeats from the earlier videos. All free, all credited below. Let''s dive straight back
    in.'
- kind: intro
  narration: Before we dive in — every mod is free, every author is linked below, and a quick endorsement
    on Nexus genuinely helps these creators keep going. Alright, counting down from ten to one. Let's
    do it.
- kind: mod
  ref: 1
  narration: 'Number ten: The Island by aaronbrown9898. Shipwrecked off the coast of an unknown island,
    you must survive while searching for a way off the island and on to Skyrim. While searching for a
    way off you may discover an ancient Dwemer city and other ruins lost to time. Whole new places to
    explore means dozens of fresh hours added to your playthrough. The world-building and atmosphere here
    genuinely rival the base game''s best moments. If you''ve already explored every inch of vanilla Skyrim,
    this brand-new land is what you''re craving. To put that in perspective, it''s a genuine classic that''s
    been going strong since 2017. Combined with the other picks on this list, it adds up to a dramatically
    better Skyrim.'
- kind: mod
  ref: 2
  narration: 'Kicking off number nine: Northpoint by ionis. Come visit Northpoint, a winter wonderland
    filled with snow, plague, and mystery. This mod adds a new worldspace, town, dungeons, creatures,
    items, and much more. The world-building and atmosphere here genuinely rival the base game''s best
    moments. For what it''s worth, the author is still actively updating it, with a patch as recent as
    February 2026. Anyone who lives for that ''what''s over the next hill'' feeling is going to love this.
    It''s stable, well-supported, and beloved for good reason. It''s free, it''s polished, and it slots
    neatly into almost any load order. Combined with the other picks on this list, it adds up to a dramatically
    better Skyrim. This is one of those installs you''ll keep in every single playthrough.'
- kind: mod
  ref: 3
  narration: 'At number eight: Solstheim - Skaal Fishing Camp by fadingsignal. Adds a small fishing camp
    to the west of Raven Rock featuring a new Skaal tent mesh/textures. Haki and his wife sell seafood
    and other ingredients. To put that in perspective, the author is still actively updating it, with
    a patch as recent as February 2026, and more than 2 thousand players have endorsed it. The world-building
    and atmosphere here genuinely rival the base game''s best moments. Anyone who lives for that ''what''s
    over the next hill'' feeling is going to love this. If you''ve explored every inch of vanilla Skyrim,
    this new land is exactly the fix you need. It''s the kind of mod that quietly makes everything around
    it better.'
- kind: mod
  ref: 4
  narration: 'Then at number seven: Siege at Icemoth by RoastGorilla439. A small scale vanilla-esque new
    lands mod adding some new islands with new locations and dungeons in the Sea of Ghosts. As well as
    some unique items from The Elder Scrolls Blades. For what it''s worth, it''s been downloaded over
    2 million times. For anyone who plays Skyrim for the journey and the discovery, this is essential.
    This one''s for the explorers — the players who fast-travel the least and wander the most. The world-building
    and atmosphere here genuinely rival the base game''s best moments. If you somehow haven''t tried it
    yet, consider this your sign to fix that. Combined with the other picks on this list, it adds up to
    a dramatically better Skyrim.'
- kind: mod
  ref: 5
  narration: 'Number six on the list: Summerset Isle by yourenotsupposedtobeinhere. Summerset Isle, a
    Skyrim expansion mod of DLC proportion, continues the story of the Arch-Mage of Winterhold when they
    are summoned to the land of the Altmer. It''s a whole new worldspace to explore that makes Skyrim
    feel enormous all over again. The numbers back it up: more than 2 thousand players have endorsed it,
    and it''s pulled in more than 215 thousand downloads. Whole new places to explore means dozens of
    fresh hours added to your playthrough. Anyone who lives for that ''what''s over the next hill'' feeling
    is going to love this. It''s free, it''s polished, and it slots neatly into almost any load order.
    This is one of those installs you''ll keep in every single playthrough.'
- kind: mod
  ref: 6
  narration: 'Number five on the list: The Shire by TheBawb. The Shire is on the brink of disaster and
    it falls to an Outlander to determine its fate. Will it be conquered or liberated? In this DLC-sized
    adventure the decisions of one traveler hold the answer. Anyone who lives for that ''what''s over
    the next hill'' feeling is going to love this. And it''s not just me who rates it — it''s pulled in
    more than 135 thousand downloads. It''s a whole new worldspace to explore that makes Skyrim feel enormous
    all over again. For anyone who plays Skyrim for the journey and the discovery, this is essential.
    It''s the kind of mod that quietly makes everything around it better. If you somehow haven''t tried
    it yet, consider this your sign to fix that.'
- kind: mod
  ref: 7
  narration: 'Kicking off number four: Warden of the Coast by TheBawb. Warden of the Coast is a fully-voiced
    DLC-sized adventure heavily inspired by the game mechanics of Mass Effect and Dragon Age. It drops
    in seamlessly, so you can sail or wander off to somewhere brand new from your current save. If you''ve
    already explored every inch of vanilla Skyrim, this brand-new land is what you''re craving. The world-building
    and atmosphere here genuinely rival the base game''s best moments. The numbers back it up: it''s pulled
    in more than 486 thousand downloads, and more than 3 thousand players have endorsed it. If you somehow
    haven''t tried it yet, consider this your sign to fix that. Combined with the other picks on this
    list, it adds up to a dramatically better Skyrim.'
- kind: mod
  ref: 8
  narration: 'Sliding in at number three: Midwood Isle by DdsLedg. Travel to Midwood Isle, a small island
    home to the Sonmer, filled with quests and adventures in this DLC sized New Lands mod. Anyone who
    lives for that ''what''s over the next hill'' feeling is going to love this. It''s a whole new worldspace
    to explore that makes Skyrim feel enormous all over again. Whole new places to explore means dozens
    of fresh hours added to your playthrough. The numbers back it up: it''s been downloaded over 1 million
    times, and the author is still actively updating it, with a patch as recent as July 2026. Combined
    with the other picks on this list, it adds up to a dramatically better Skyrim.'
- kind: mod
  ref: 9
  narration: 'Kicking off number two: Wyrmstooth by Jonx0r. A large DLC-sized quest expansion for Skyrim
    featuring a new island to explore, fully voice acted NPCs, new dungeons, new music, and a player home.
    Whole new places to explore means dozens of fresh hours added to your playthrough. To put that in
    perspective, more than 25 thousand players have endorsed it, and it''s been downloaded over 6 million
    times. This one''s for the explorers — the players who fast-travel the least and wander the most.
    It''s a whole new worldspace to explore that makes Skyrim feel enormous all over again. If you somehow
    haven''t tried it yet, consider this your sign to fix that. It''s stable, well-supported, and beloved
    for good reason.'
- kind: mod
  ref: 10
  narration: 'And finally, my number one pick on the whole list: Falskaar by AlexanderJVelicky. A DLC
    sized new lands mod that adds 20+ hours of fully voiced lore friendly (But not canon) quests, dungeons,
    and more. For anyone who plays Skyrim for the journey and the discovery, this is essential. Anyone
    who lives for that ''what''s over the next hill'' feeling is going to love this. If you''ve explored
    every inch of vanilla Skyrim, this new land is exactly the fix you need. The numbers back it up: it''s
    a genuine classic that''s been going strong since 2016. If you install one single mod from this entire
    video, make it this one — it earns the top spot. If you somehow haven''t tried it yet, consider this
    your sign to fix that. It''s stable, well-supported, and beloved for good reason.'
- kind: outro
  narration: That wraps up 10 of my favourite new lands mods right now. Go endorse the authors down in
    the description — they've earned it — and if you want more lists like this, subscribe; there's a new
    one every few days. Thanks for watching, see you next time.
