segments:
- kind: hook
  narration: Somewhere out past the borders of Skyrim there are entire islands, continents, and hidden
    realms that most players will never even know exist. Today I'm taking you to ten of them. Brand new
    lands, all completely free, and the one sitting at number one might just be the single greatest Skyrim
    mod ever made. Let's go.
- kind: intro
  narration: Every mod on this list adds a whole new place to explore, with its own quests, its own dungeons,
    and its own stories, all bolted seamlessly onto your current save. Everything here is free on Nexus,
    and every creator is credited down in the description, so please go endorse their work. We're counting
    down from number ten all the way to number one, so settle in. Here we go.
- kind: mod
  ref: 1
  narration: 'Number ten: The Island, by aaronbrown9898. This one opens with you shipwrecked off the coast
    of a mysterious, uncharted island, with nothing but the goal of surviving and finding your way back
    to Skyrim. But this is no empty rock. As you search the coastline for an escape, you''ll stumble onto
    the ruins of an ancient Dwemer city, buried and forgotten, along with other secrets lost to time.
    It leans hard into that survival-and-discovery fantasy that made you fall in love with exploring in
    the first place. No quest marker holding your hand, just you, the wilderness, and the itch to see
    what''s over the next ridge. It''s a compact adventure rather than a hundred-hour epic, which makes
    it perfect for a weekend playthrough, and with over fourteen hundred players endorsing it, plenty
    of explorers have washed up on this shore and come away impressed. A great low-stakes way to kick
    off the list. But trust me, the scale only grows from here.'
- kind: mod
  ref: 2
  narration: At number nine, come and visit Northpoint, by ionis. Picture a winter wonderland, but one
    with a dark heart. This mod drops in an entirely new, snow-blanketed worldspace, complete with its
    own town, its own dungeons, custom creatures, and unique items to hunt down. What sets it apart is
    the atmosphere. There's a creeping plague spreading through the region and a mystery tangled underneath
    it all, so exploring Northpoint feels less like sightseeing and more like walking into a story that's
    already gone wrong. If you love that quiet, ominous, snowbound corner of Skyrim up around Winterhold,
    and you always wished there was simply more of it, this scratches exactly that itch. It's atmospheric,
    it's self-contained, and it slots in beautifully alongside the other picks on this list. With over
    fifteen hundred endorsements, it's a proven favourite for players who like their new lands with a
    little dread mixed in. Wrap up warm, and keep going, because number eight is a hidden little gem.
- kind: mod
  ref: 3
  narration: 'Number eight is a smaller one, but hear me out, because it punches well above its size:
    the Skaal Fishing Camp on Solstheim, by fadingsignal. This adds a cosy little fishing settlement to
    the west of Raven Rock, over on Solstheim, complete with a brand-new Skaal tent design with its own
    custom meshes and textures that look like they shipped with the Dragonborn expansion. You''ll meet
    Haki and his wife, who run the camp and sell seafood and fresh ingredients you won''t easily find
    anywhere else. Now, this isn''t a forty-hour questline, it''s a location mod, but that''s exactly
    the point. It''s the kind of small, lovingly made addition that makes the world feel lived-in and
    real, the sort of place you stumble on, remember, and start swinging by on every single playthrough.
    Fadingsignal is a hugely respected name in this community, and the craftsmanship here shows exactly
    why, with nearly twenty-four hundred players endorsing this tiny camp. Little touches like this are
    the connective tissue of a great load order. But now, we start ramping things up.'
- kind: mod
  ref: 4
  narration: 'Coming in at number seven: Siege at Icemoth, by RoastGorilla. This is a small-scale, beautifully
    vanilla-flavoured new lands mod that adds a cluster of new islands out in the Sea of Ghosts, north
    of Skyrim, each one packed with fresh locations and dungeons to clear. What makes it special is the
    detail. You''ll find unique items pulled straight from The Elder Scrolls Blades woven into the loot,
    and, this is the fun part, some of the guard dialogue is voiced by Paul Ganus himself, the actual
    voice of the Imperial guards in the base game. That kind of authenticity is incredibly rare in a free
    mod, and it means Icemoth blends into Skyrim so smoothly you''d swear it was official content. It''s
    designed to feel like a natural extension of the world rather than a flashy standalone, which is exactly
    what so many immersion players are after. With nearly twenty-five hundred endorsements, it''s a quiet
    favourite that deserves a lot more attention. Set sail for it, and then brace yourself, because number
    six is a full-blown expansion.'
- kind: mod
  ref: 5
  narration: 'At number six, we''ve got a genuine heavyweight: Summerset Isle, by the modder with possibly
    the best username on all of Nexus, yourenotsupposedtobeinhere. This is a Skyrim expansion of true
    DLC proportions, and it picks up a thread the base game leaves dangling. Your character, now Arch-Mage
    of Winterhold, is summoned across the sea to the shining homeland of the Altmer. What follows is a
    sprawling blend of mystery and heroic fantasy, but the real magic is the openness. This isn''t a corridor
    of quest markers. You''re given room to explore, to make your own choices, and crucially, to make
    mistakes, and your actions carry real consequences that ripple through the story. That''s the kind
    of reactive, choose-your-own-path design most mods don''t even attempt. If you want a new land that
    respects your intelligence and rewards your curiosity, Summerset Isle delivers hours of it. Over twenty-five
    hundred players have endorsed the journey. It''s ambitious, it''s atmospheric, and it''s only getting
    bigger from here, because the top five is where things get truly special.'
- kind: mod
  ref: 6
  narration: 'Number five on the list: The Shire, by TheBawb. And yes, that Shire. This DLC-sized adventure
    carries you off to Middle-earth''s most peaceful little corner, except peace is the one thing it doesn''t
    have, because the Shire is teetering on the brink of disaster. And it falls to you, an outlander,
    to decide its fate. Will this gentle green land be conquered, or liberated? The whole mod hangs on
    the choices of a single traveller, you, which gives real weight to every decision you make. It''s
    a gorgeous, cosy change of pace from Skyrim''s usual snow and dragons, trading the frozen tundra for
    rolling hills and hobbit-holes, and it''s crafted with obvious love for the source material. With
    over three thousand endorsements, it''s struck a chord with players hungry for something warmer and
    more whimsical, without giving up on real stakes and a real story. And TheBawb, by the way, is about
    to show up again, because this is one of two entries from the very same creator. Speaking of which,
    let''s talk about number four.'
- kind: mod
  ref: 7
  narration: 'And here''s that second one, at number four: Warden of the Coast, also by TheBawb. If The
    Shire was cosy, this is the epic. It''s a fully-voiced, DLC-sized adventure that wears its inspirations
    proudly on its sleeve, borrowing its best ideas straight from Mass Effect and Dragon Age. You travel
    to an isolated island and, over the course of the story, you have to earn the loyalty of nine unique
    companions, actually win them over, BioWare-style, before facing down a daedric lord trying to claw
    his way back into power and slam the jaws of Oblivion shut once more. That companion-loyalty system
    is something Skyrim has never really done, and having it all fully voiced sells the whole thing completely.
    This is the kind of mod that makes you forget you''re even playing Skyrim anymore. It''s a staggering
    amount of work for one modder to pull off, and the community has rewarded it with well over three
    thousand endorsements. Two knockout mods from one creator, so go endorse both of them. Now, the top
    three are legendary. Let''s begin.'
- kind: mod
  ref: 8
  narration: 'Number three: Midwood Isle, by DdsLedg. Set sail for a small but stunning island that''s
    home to a people you''ve never met before, the Sonmer, and dive into a DLC-sized new lands mod absolutely
    packed with quests and adventures. What''s remarkable about Midwood is how complete it all feels.
    An entirely original culture, its own worldspace, its own storylines, all woven together with a level
    of polish that rivals official content. It''s the kind of place where you arrive planning to poke
    around for twenty minutes, and you look up three hours later, completely absorbed. With over six and
    a half thousand endorsements, Midwood Isle has earned its reputation as one of the must-play new lands
    mods, and once you visit, you''ll understand exactly why. This is the point on the list where we cross
    over from great into genuinely essential. But as good as Midwood is, the final two are on another
    level entirely, the kind of mods that get recommended in the same breath as official DLC. Here''s
    number two.'
- kind: mod
  ref: 9
  narration: 'At number two, an absolute legend of the modding scene: Wyrmstooth, by Jonx0r. This is a
    large, DLC-sized quest expansion that whisks you away to a brand-new island, and it does very nearly
    everything right. Fully voice-acted characters. A whole batch of new dungeons to delve. An original
    musical score that sits perfectly beside the base game''s. And your own player home to call a base
    of operations. Wyrmstooth had a famous disappearance and a triumphant return over the years, and through
    all of it the community never stopped asking for it, because it is, quite simply, one of the most
    professional, most polished new lands mods ever released. The staggering twenty-five thousand endorsements
    tell the whole story. This is a mod that lands in an enormous number of load orders and basically
    never leaves them. If Wyrmstooth had come out as paid DLC, nobody would have blinked. It is that good.
    And yet, somehow, it''s still only number two. Which brings us, finally, to the greatest new land
    Skyrim has ever seen.'
- kind: mod
  ref: 10
  narration: 'And finally, my number one pick on the entire list: Falskaar, by AlexanderJVelicky. If you
    install one single mod from this whole video, make it this one. Falskaar is a DLC-sized new land that
    adds more than twenty hours of fully-voiced, lore-friendly quests, brand-new dungeons, and a gorgeous
    original worldspace to completely lose yourself in. But here''s what makes it legendary. Alexander
    built Falskaar as a young man to prove that he could make games, and it turned out so staggeringly
    professional that it literally landed him a job in the actual games industry. That is the level we
    are talking about. Fully voiced, beautifully written, with its own soundtrack and a story that stands
    shoulder to shoulder with anything Bethesda ever shipped. With an almost unbelievable thirty-seven
    thousand endorsements, Falskaar isn''t just a mod, it''s a piece of Skyrim history, the gold standard
    that every new lands project since has been measured against. It''s the reason I made this video.
    Go download it, go endorse Alexander, and go get lost in Falskaar. You will not regret it.'
- kind: outro
  narration: And that's the list. Ten of the very best new lands mods you can play right now, every one
    of them free, and every single creator linked down in the description with full credit, so please,
    take ten seconds and go endorse their work. It genuinely keeps them making this stuff. If you enjoyed
    this, hit subscribe, because I put out new Skyrim mod videos every week. Drop a comment telling me
    which new land is your favourite, and I'll see you in the next one. Thanks so much for watching.
