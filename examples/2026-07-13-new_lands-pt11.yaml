slug: 2026-07-13-new_lands-pt11
title: 10 Skyrim New Lands Mods You Probably Missed (Vol. 11)
category_id: new_lands
format: category_list
hook_line: Best New Lands Mods
description: Ten more brand-new lands, islands and worlds for Skyrim in 2026, counted down from 10 to
  1. Every mod is free and linked below with full credit to its author — go endorse them!
tags:
- skyrim new lands mods
- skyrim new worldspace
- skyrim dlc mods
- skyrim exploration
- skyrim mods 2026
- skyrim island mods
segments:
- kind: hook
  narration: Skyrim's map has felt fully explored for over a decade, but the modding community keeps smuggling
    in entire new islands, continents and worlds that Bethesda never built. Today I've got ten fresh new
    lands to lose yourself in, from the shores of Morrowind to the mysteries of Akavir, and the one at
    number one might be the most seamless of them all. Let's set sail.
- kind: intro
  narration: Every mod here adds a brand-new place to explore, dropped right into your current save, and
    every one is free on Nexus with the creators credited below. We're counting down from number ten to
    number one. Let's get into it.
- kind: mod
  ref: 1
  narration: 'Number ten: the Isle of Artaeum by Fuse00 and the Artaeum team. If you''ve done the Psijic
    questline in vanilla, you know the sting: the Order''s mystical island is teased constantly but you
    never actually get to explore it. This mod finally opens it up as a full new worldspace, Season Three
    of an ongoing project, with the floating Psijic isle, its monks, and a genuine questline to sink into.
    What makes it special is the atmosphere. It nails that dreamy, out-of-time feeling the Psijic Order
    is supposed to have, rather than just being another rocky island. It''s an ongoing series, so a few
    corners still feel like work in progress, but as a starting point for our list it''s a gorgeous place
    to sail off to. Speaking of hidden valleys, let''s head somewhere a little stranger.'
- kind: mod
  ref: 2
  narration: At number nine, Hestra's Nest by ArcaneUniversity. Vanilla Skyrim is grim, cold, and constantly
    trying to kill you, and sometimes you just want somewhere warm to put your feet up. Beyond the Druadach
    Mountains this mod hides an entire cozy valley of merry misfits, wanderers and retired adventurers
    who've quietly built a life away from all the dragon nonsense. It's a proper new little worldspace
    with its own inhabitants, daily routines and gentle secrets to poke around in. What sets it apart
    is the tone. It's charming and funny rather than epic, a place that feels lived-in and human. If you
    play Skyrim to relax as much as to fight, Hestra's Nest is a lovely detour. But now let's get back
    to something with a real story to tell.
- kind: mod
  ref: 3
  narration: 'Number eight: The Tempest Isle by Cryptdick. So many location mods drop a pretty island
    on the map and forget to give you a reason to go there. Tempest Isle does the opposite. It''s a hand-sculpted
    new worldspace built around a fully scripted, fully voiced main storyline, with multiple quests, memorable
    characters, new items, spells and custom enemy variants to fight along the way. The craftsmanship
    is the standout, this is one person shaping an entire island by hand and voicing a real narrative
    on top of it. It genuinely plays like a small official expansion. It''s a hefty download and expects
    you to actually engage with the story rather than just sightsee, but that''s exactly the point. Next
    up, a new land that plays with time itself.'
- kind: mod
  ref: 4
  narration: Coming in at number seven, The Chain of Time by Betalille. Skyrim's islands are usually just
    scenery, you look, you loot, you leave. The Chain of Time instead ties its archipelago together with
    a melancholy, character-driven story that slowly unfolds as you travel from island to island. You're
    piecing together what happened here, and the writing has real heart to it, the kind of quiet, bittersweet
    tone most mods never even attempt. Each island is its own little chapter with its own discoveries.
    It leans more atmospheric and narrative than combat-heavy, so if you're purely after a dungeon-crawl
    this isn't it, but if you love a new land that actually tells you something, this one lingers. Now,
    from quiet reflection to all-out war.
- kind: mod
  ref: 5
  narration: At number six, Curse of Akavir by Sengetsu. We've all wondered about Akavir, the mysterious
    continent across the sea that the lore hints at but the games never let us visit. This mod takes you
    there, and it does not hold back, featuring large-scale battles with dozens of combatants, new enemies,
    and a sprawling foreign land completely unlike Skyrim. Its ambition is the draw. Very few mods even
    attempt Akavir, and fewer still throw armies at you once you arrive. Fair warning, it's an older,
    sprawling mod that needs the full DLC and the Fuz Ro D-oh silent-voice patch, and it can be a little
    rough around the edges, but for the sheer spectacle of finally setting foot in Akavir, it earns its
    spot. Let's trade the war zone for a beach.
- kind: mod
  ref: 6
  narration: 'Number five: Lagoon, a tropical island mod by OldSaitoType02. Snow, snow, and more snow,
    Skyrim''s palette gets old, and there''s nowhere sunny to actually take your followers. Lagoon answers
    that with a lush tropical island built as a warm-weather home base, palm trees, beaches, and blue
    water, designed to house a whole crowd of your followers. It''s a complete change of scenery, and
    honestly a bit of a mood-lifter after a hundred hours in the tundra. The author''s notes are in Japanese
    and the screenshots may differ slightly from the current build, so expect a little language barrier
    in the docs, but the island itself speaks for itself. A perfect holiday from dragons. Next, a new
    land with a genuine cult problem.'
- kind: mod
  ref: 7
  narration: At number four, The Realm of Merentif by venjhammet. Most new lands are peaceful until you
    poke them, but Merentif hands you a ticking clock. The land of Vominheim is quietly being targeted
    by the Disciples of Vuldur, a vicious cult scheming to open a portal and reclaim the realm, and its
    people have no idea what's coming. You do. That impending-doom framing is what makes it work, you're
    exploring a fully realized new worldspace while a real threat builds in the background, giving every
    location a sense of purpose. venjhammet is a seriously prolific new-lands author, and the polish shows.
    It's a meaty questline, so set aside an evening. And speaking of venjhammet, they've earned two spots
    on this list.
- kind: mod
  ref: 8
  narration: 'Number three: The Isle of Valefrost, also by venjhammet. If Merentif was a slow-burn threat,
    Valefrost is pure gothic atmosphere. You set sail to an island steeped in ancient lore, perpetual
    fog and bitter frost, where you''ll uncover the dark secrets of House Malvak, clash with the Sea Vipers
    pirates and the dreaded Greyfang vampires, and slowly unravel what cursed this place. The mood is
    the star, the constant fog and cold make Valefrost feel genuinely haunted in a way few new lands manage.
    It''s packed with dungeons, factions, and a proper central mystery, easily rivaling official content
    in scope. Having two mods this good from a single author is ridiculous. But there''s still an even
    bigger world waiting at number two.'
- kind: mod
  ref: 9
  narration: At number two, Journey to Baan Malur and Morrowind by pancake0723. Every Elder Scrolls fan
    has wished they could just walk to Morrowind, and most mods that try end up as empty ashy hills. Baan
    Malur actually delivers, opening up the north-west Julan-Shar region of Morrowind, home to the provincial
    capital of Cormaris, with fully-voiced NPCs running unique daily schedules, finished interiors, and
    a stack of dungeons to explore. What lifts it above the rest is how lived-in it feels. The voiced
    characters and real routines make Baan Malur read like a place that exists whether you're there or
    not, not a diorama. If you've ever wanted Morrowind's mushrooms and Dunmer culture bolted onto Skyrim's
    engine, this is the one. And finally, my number one pick.
- kind: mod
  ref: 10
  narration: 'And finally, my number one new land on this list: Solstheim - The Lost Levels, ported and
    maintained by GreyMtnFox from the original by Ionisthebear and Thingy Person. Even with the Dragonborn
    DLC, Solstheim always felt like it was hiding more than it showed, half-explored and full of locked-off
    potential. The Lost Levels fills exactly that gap, layering in new areas, dungeons and content across
    Solstheim so the island finally feels complete. What earns it the top spot is how naturally it blends
    in, it doesn''t feel like a bolt-on new land, it feels like the rest of the Solstheim Bethesda never
    finished. It slots into your existing Dragonborn playthrough seamlessly, and it''s functionally identical
    to the beloved original. If you install one new land from this video, make it this one. Go and get
    lost on Solstheim.'
- kind: outro
  narration: And that's ten more new lands to add to your load order, every one of them free and linked
    in the description. Drop a comment telling me which world you're sailing to first, subscribe for more
    Skyrim mod videos, and I'll catch you in the next one. Happy modding, everyone.
