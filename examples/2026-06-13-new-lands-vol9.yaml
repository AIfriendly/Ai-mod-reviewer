- best skyrim mods
- '2026'
segments:
- kind: hook
  narration: 'You asked for more, so here''s part 9: 16 more of the best new lands mods I could find,
    with zero repeats from the earlier videos. All free, all credited below. Let''s dive straight back
    in.'
- kind: intro
  narration: 'One thing up front: I''m ranking these from number sixteen down to my personal number one,
    and reasonable people will absolutely disagree on the order — let me know yours in the comments. Everything''s
    free and linked below. Let''s get started.'
- kind: mod
  ref: 1
  narration: 'Kicking off number sixteen: Improved Companions - Questline Tweaks by Parapets. Actually
    back out of becoming a werewolf without leaving Skjor and Aela stuck in the Underforge forever, and
    various other tweaks for the Companions. Anyone who plays Skyrim mainly for the questing and the stories
    is going to be thrilled with this. And it''s not just me who rates it — more than 8 thousand players
    have endorsed it. For anyone who plays Skyrim for the journey and the discovery, this is essential.
    If you somehow haven''t tried it yet, consider this your sign to fix that.'
- kind: mod
  ref: 2
  narration: 'Number fifteen on the list: Faction - Pit Fighter by PrivateEye. Conversion of the mod by
    ThirteenOranges. Pit Fighter contains an all new faction to join, complete with NPCs, progression
    through the ranks, unique rewards and side quests. This one''s for the explorers — the players who
    fast-travel the least and wander the most. If you''ve explored every inch of vanilla Skyrim, this
    is exactly the fix you need. The numbers back it up: it''s been downloaded over 2 million times. Combined
    with the other picks on this list, it adds up to a dramatically better Skyrim.'
- kind: mod
  ref: 3
  narration: 'Sliding in at number fourteen: Levelers Tower v4.4 by WilliamSea. Player Home Base with
    so many features it will make your head spin. It''s the kind of adventure that makes Skyrim feel enormous
    all over again. If you''ve already cleared every vanilla dungeon twice, this is exactly the fresh
    content you''re craving. The numbers back it up: more than 8 thousand players have endorsed it, and
    it''s a genuine classic that''s been going strong since 2016. If you somehow haven''t tried it yet,
    consider this your sign to fix that.'
- kind: mod
  ref: 4
  narration: 'Sliding in at number thirteen: Unlimited Bookshelves by Nazenn. Lets you place as many books
    on a bookshelf as will fit, instead of a fixed number, as well as any other kind of item. Up to around
    90 letter/note type books on a single shelf, and not limited to just books! This one''s for the explorers
    — the players who fast-travel the least and wander the most. The world-building and atmosphere here
    genuinely rival the base game''s best moments. The numbers back it up: it''s pulled in more than 333
    thousand downloads, and it''s a genuine classic that''s been going strong since 2016.'
- kind: mod
  ref: 5
  narration: 'Sliding in at number twelve: Unique Border Gates by Kelsenellenelvian. Unique Border Gates
    redesigns the border crossings of Cyrodill, Hammerfell and Morrowind by adding new, unique and immersive
    gates. And it''s not just me who rates it — more than 10 thousand players have endorsed it, and it''s
    a genuine classic that''s been going strong since 2016. The world-building and atmosphere here genuinely
    rival the base game''s best moments. Anyone who plays Skyrim mainly for the questing and the stories
    is going to be thrilled with this.'
- kind: mod
  ref: 6
  narration: 'Sliding in at number eleven: JK''s Riverfall Cottage by jkrojmal. A cozy medium size player
    home near Riverwood. If you''ve explored every inch of vanilla Skyrim, this is exactly the fix you
    need. The numbers back it up: the author is still actively updating it, with a patch as recent as
    March 2025. If you''ve already cleared every vanilla dungeon twice, this is exactly the fresh content
    you''re craving. It''s free, it''s polished, and it slots neatly into almost any load order.'
- kind: mod
  ref: 7
  narration: 'Kicking off number ten: Penitus Oculatus by wSkeever. A quest where you can join the Penitus
    Oculatus after the vanilla "destroy the dark brotherhood" quest and get all the rewards. The numbers
    back it up: it''s been downloaded over 2 million times, and it''s a genuine classic that''s been going
    strong since 2018. For anyone who plays Skyrim for the journey and the discovery, this is essential.
    This one''s for the explorers — the players who fast-travel the least and wander the most. Combined
    with the other picks on this list, it adds up to a dramatically better Skyrim.'
- kind: mod
  ref: 8
  narration: 'Number nine: Thieves Guild For Good Guys - Taking Care of Business Redux by Mordivier2.
    Ever wanted to join the Thieves Guild without sending people to jail or bullying people for money?
    Want to tell Maven off? Want Mjoll to like you without having to lie to her about the Thieves Guild?
    Want to be a Robin Hood type thief? For what it''s worth, it''s a genuine classic that''s been going
    strong since 2017. For anyone who plays Skyrim for the journey and the discovery, this is essential.
    Anyone who plays Skyrim mainly for the questing and the stories is going to be thrilled with this.'
- kind: mod
  ref: 9
  narration: 'Number eight: All Thieves Guild Jobs Concurrently by 8Phantasm. Lets you take on all seven
    types of Thieves Guild jobs at once, instead of only one from Delvin and one from Vex at a time. For
    what it''s worth, more than 13 thousand players have endorsed it, and it''s a genuine classic that''s
    been going strong since 2018. For anyone who plays Skyrim for the journey and the discovery, this
    is essential. Anyone who plays Skyrim mainly for the questing and the stories is going to be thrilled
    with this.'
- kind: mod
  ref: 10
  narration: 'Then at number seven: Blackthorn - A Buildable Town in The Rift by Ld50365. Blackthorn is
    a large Hearthfire inspired buildable player home/town with over 400+ build options to choose from,
    it also includes plenty of Safe Storage,. Whole new places to explore means dozens of fresh hours
    added to your playthrough. And it''s not just me who rates it — more than 14 thousand players have
    endorsed it. If you''ve already cleared every vanilla dungeon twice, this is exactly the fresh content
    you''re craving.'
- kind: mod
  ref: 11
  narration: 'Coming in at number six: Open Civil War by simtam. Unlocks civil war cut city battles and
    put them in an open strategy wargame, accessible through the war maps. Whole new places to explore
    means dozens of fresh hours added to your playthrough. This one''s for the explorers — the players
    who fast-travel the least and wander the most. For what it''s worth, it''s been downloaded over 1
    million times, and more than 14 thousand players have endorsed it. Combined with the other picks on
    this list, it adds up to a dramatically better Skyrim.'
- kind: mod
  ref: 12
  narration: 'Then at number five: Magical College of Winterhold by Sable17. A lightly magical, aesthetic
    overhaul for the College of Winterhold! Whole new places to explore means dozens of fresh hours added
    to your playthrough. This one''s for the explorers — the players who fast-travel the least and wander
    the most. To put that in perspective, more than 20 thousand players have endorsed it. It''s free,
    it''s polished, and it slots neatly into almost any load order.'
- kind: mod
  ref: 13
  narration: 'Number four on the list: Opulent Thieves Guild by Sokkvabekk. A lavish, gaudy overhaul of
    the Thieves Guild HQ and the Ragged Flagon. Occurs gradually, attached to the four stages of upgrades
    existing in vanilla Skyrim. If you''ve already cleared every vanilla dungeon twice, this is exactly
    the fresh content you''re craving. For what it''s worth, it''s been downloaded over 2 million times.
    For anyone who plays Skyrim for the journey and the discovery, this is essential. It''s stable, well-supported,
    and beloved for good reason.'
- kind: mod
  ref: 14
  narration: 'Coming in at number three: LC_Build Your Noble House by Locaster. This mod will give you
    the chance to build your own noble fiefdom with your own hands. You will only start with a small shed
    and a tent, but in time you build a whole village and your own fortified noble house. It drops in
    seamlessly, so you can stumble into the adventure right in your current save. For what it''s worth,
    it''s a genuine classic that''s been going strong since 2018. If you''ve already cleared every vanilla
    dungeon twice, this is exactly the fresh content you''re craving.'
- kind: mod
  ref: 15
  narration: 'Coming in at number two: Elysium Estate by thejadeshadow. Elysium Estate is a mid-sized,
    lore friendly home located near Whiterun for you, or with family and followers. Full of foliage, fountains,
    features to customize, optional displays, crafting and plenty more. The numbers back it up: it''s
    been downloaded over 1 million times, and more than 26 thousand players have endorsed it. Anyone who
    plays Skyrim mainly for the questing and the stories is going to be thrilled with this. It drops in
    seamlessly, so you can stumble into the adventure right in your current save.'
- kind: mod
  ref: 16
  narration: 'And finally, my number one pick on the whole list: Elianora''s Breezehome Overhaul by Elianora.
    Mod overhauls the iconic Whiterun player home to be worthy of the thane of Whiterun. This is not Breezehome
    TNF - Elianora''s Flavour. It is a completely new mod, made especially for SSE and it is glorious
    af. The world-building and atmosphere here genuinely rival the base game''s best moments. This one''s
    for the explorers — the players who fast-travel the least and wander the most. For what it''s worth,
    it''s a genuine classic that''s been going strong since 2016, and more than 50 thousand players have
    endorsed it. If you install one single mod from this entire video, make it this one — it earns the
    top spot.'
- kind: outro
  narration: That wraps up 16 of my favourite new lands mods right now. Go endorse the authors down in
    the description — they've earned it — and if you want more lists like this, subscribe; there's a new
    one every few days. Thanks for watching, see you next time.
