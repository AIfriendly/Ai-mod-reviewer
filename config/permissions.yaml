# Media-reuse permission ledger (footage policy).
#
# NexusMods' API does NOT expose a reliable "media reuse allowed" flag, and mod
# authors retain full ownership of their uploads. So we DO NOT auto-scrape media.
# Instead, you record here which mods/authors have granted permission to feature
# their media (DM, comment, public "free to use in videos w/ credit" note, etc.).
#
# When channel.yaml ranking.require_reuse_permission is true, ONLY mods listed as
# approved here are eligible to have their media downloaded and shown.
#
# Always credit the author on screen + in the description regardless.

# Authors who have blanket-approved media reuse with credit:
approved_authors: []
  # - "SomeModAuthor"

# Specific approved mods (by NexusMods mod_id):
approved_mod_ids: []
  # - 266      # "Static Mesh Improvement Mod" — author approved via comment 2026-01

# Authors/mods explicitly denied (never feature these):
denied_authors: []
denied_mod_ids: []

# If you set this true, the research stage will still RANK and script unapproved
# mods, but the asset stage will use placeholder slates (no downloaded media) until
# you add them above. Lets you test the pipeline end-to-end before chasing permissions.
allow_placeholder_for_unapproved: true

# ⚠️ TOS-VIOLATING OPT-IN. The official API exposes only ONE image per mod. If true,
# the asset stage reads each approved mod's *website* page to collect its full image
# gallery (dozens of screenshots). This is against the NexusMods ToS/API policy and
# the account behind your API key could be banned. Off by default. Only runs for
# approved mods; authors are still credited. gallery_max_images caps how many per mod.
allow_gallery_scrape: false
gallery_max_images: 6

# ⚠️ INFORMED OPT-IN. If true, the pipeline treats EVERY mod's main API image as
# reusable (still always crediting the author on screen + in the description).
# This is the "fully automated" footage mode — but mod authors retain ownership and
# some forbid media reuse, so a few may issue takedowns. Recommended instead: leave
# this false and `skyrim-reviewer approve <author>` the mods whose authors permit it
# (DM/comment/"free to use in videos with credit"). You accept responsibility for
# what you publish with this on.
assume_all_permitted: false
