# Text-to-speech configuration.
# The narration stage is provider-pluggable. Set `provider` and fill the matching
# section. Your CLONED VOICE plugs in here.

# provider: elevenlabs | openai | piper | f5tts | prerecorded
provider: f5tts

elevenlabs:
  # voice_id of YOUR cloned voice. Either set it here or via ELEVENLABS_VOICE_ID env.
  voice_id: "${ELEVENLABS_VOICE_ID}"
  model: "eleven_multilingual_v2"
  stability: 0.45
  similarity_boost: 0.8
  style: 0.0
  output_format: "mp3_44100_128"

openai:
  model: "gpt-4o-mini-tts"
  voice: "onyx"

piper:
  # Local, offline, free. Point to a downloaded Piper voice model.
  model_path: "voices/en_US-ryan-high.onnx"

f5tts:
  # YOUR cloned voice via F5-TTS (zero-shot). Prepare the reference clip with
  # `skyrim-reviewer voice-prep <your_sample.wav>` (clean ≤15s, 24kHz mono).
  ref_audio: "voices/clone/ref_primary.wav"
  ref_text: ""              # leave empty to auto-transcribe the reference (Whisper)
  model: "F5TTS_v1_Base"
  speed: 1.0                # <1.0 = slower / more deliberate delivery
  nfe_step: 32              # 32 = best quality (clarity); GPU handles it fast
  # seed: 42                # set for reproducible takes

prerecorded:
  # Use audio you (or your cloned voice) rendered yourself.
  # Drop one wav/mp3 per segment named <segment_id>.wav in this dir.
  audio_dir: "work/narration"

# Pacing
words_per_minute: 155
pause_between_segments_ms: 450

# Voice mastering: bring the cloned voice forward (close-mic) + even, broadcast level.
enhance: true
