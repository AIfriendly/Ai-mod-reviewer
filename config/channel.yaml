# Channel strategy & video structure.
# Defaults encode the research findings (see README "Research-backed strategy").

channel:
  name: "ModVault"
  game_domain: "skyrimspecialedition"   # NexusMods domain slug (game)
  youtube_handle: "@modvault666"        # for `learn` (public stats via yt-dlp, no API key)
  # Hybrid strategy: evergreen category lists are the backbone, thematic specials
  # are the viral spikes. The pipeline tags each project with its format.
  default_format: "category_list"        # category_list | transformation | weekly_roundup

# Evergreen category "buckets" you rotate through for the backbone videos.
# Each maps to NexusMods category ids / search terms used by the research stage.
# nexus_category_ids verified against the live skyrimspecialedition game endpoint.
categories:
  - id: weapons
    title: "Best Skyrim Weapon Mods"
    nexus_category_ids: [55, 36]         # Weapons; Weapons and Armour
    search_terms: ["weapon", "sword", "bow"]
  - id: armor
    title: "Best Skyrim Armor & Clothing Mods"
    nexus_category_ids: [54, 60, 103, 36]  # Armour; Clothing & Accessories; Shields; Weapons+Armour
    search_terms: ["armor", "armour", "clothing", "outfit"]
  - id: new_lands
    title: "Best Skyrim New Lands Mods"
    nexus_category_ids: [89, 35]         # Locations - New; Quests and Adventures (filtered to lands)
    search_terms: ["new lands", "worldspace", "island", "explore"]
  - id: quests
    title: "Best Skyrim Quest Mods"
    nexus_category_ids: [35]             # Quests and Adventures (filtered to pure quests)
    search_terms: ["quest", "questline", "story", "adventure"]
  - id: adventures
    title: "Best Skyrim New Lands & Quest Mods"   # merged topic: lands + quests in one
    nexus_category_ids: [89, 35]         # Locations - New + Quests and Adventures
    graphql_categories: ["Locations -  New", "Quests and Adventures"]
    search_terms: ["new lands", "worldspace", "island", "explore",
                   "quest", "questline", "story", "adventure"]
  - id: graphics
    title: "Best Skyrim Graphics & Visual Mods"
    nexus_category_ids: [62, 29, 97, 74]  # Visuals & Graphics; Models & Textures; ENB/ReShade; Environmental
    search_terms: ["enb", "texture", "graphics", "lighting"]
  - id: gameplay
    title: "Best Skyrim Gameplay Overhaul Mods"
    nexus_category_ids: [79, 77, 24, 78]  # Overhauls; Combat; Gameplay; Immersion
    search_terms: ["combat", "overhaul", "survival", "ai"]
  - id: followers
    title: "Best Skyrim Follower Mods"
    nexus_category_ids: [44]
    graphql_categories: ["Followers & Companions"]
    search_terms: ["follower", "companion"]
  - id: magic
    title: "Best Skyrim Magic Mods"
    nexus_category_ids: [21, 85]
    graphql_categories: ["Magic - Spells & Enchantments", "Magic - Gameplay"]
    search_terms: ["magic", "spell", "enchant"]

# Target video shape. Channel plan: ~2 uploads/week, 10-15 min each -> `standard`
# is the default. `test` (5 min) quickly validates quality; `full` (20 min) is for
# occasional deep-dives.
# Select at runtime:  skyrim-reviewer make --profile standard   (default)
#                     skyrim-reviewer make --profile test | full
video:
  active_profile: "standard"  # standard (10-15 min) | test (5 min) | full (20 min)
  resolution: [1920, 1080]
  fps: 30
  engine: "ffmpeg"      # ffmpeg (fast, native; default) | moviepy (legacy fallback)
  # Encoder: auto-detects NVIDIA NVENC on a GPU box (fast); else multi-threaded x264.
  # Override on a GPU box with `codec: h264_nvenc`. threads defaults to all CPU cores.
  # codec: h264_nvenc       # force GPU encode (or libx264 to force CPU)
  preset: "faster"          # x264 speed/quality; veryfast < faster < medium < slow
  music_lufs: -26           # background music loudness (lower = quieter under narration)
  master_lufs: -14          # final mix loudness (YouTube's normalization target)
  captions: true            # burn animated word-chunk captions into the video
  sfx: true                 # whoosh sting at each mod reveal
  color_grade: true         # consistent cinematic grade across the whole video
  # Retention package: a cold-open teaser (pattern-interrupt before the hook) and a
  # binge-chain end card (next video in the series + subscribe) — both boost watch time
  # and session time, the biggest algorithm signals for a small series channel.
  intro_teaser: true        # ~4s rapid-cut teaser with a "wait for #1" overlay
  teaser_seconds: 4
  end_card: true            # ~11s end card linking another video in the series
  endcard_seconds: 11
  # Image-to-video: turn the still mod screenshots into real MOTION clips, stitched in
  # place of Ken Burns pans. Any image without a clip falls back to Ken Burns, so this
  # never breaks a render. Clips are cached under work/<slug>/i2v/. Two backends:
  #   local  — CPU 2.5D depth-parallax (real 3D camera move). Free, ~4s/clip, no GPU
  #            or token. Needs torch+transformers (installed on first use). DEFAULT.
  #   kaggle — generative LTX-Video on Kaggle's free GPU (water flows, fire flickers).
  #            Higher ceiling; needs KAGGLE_* creds + GPU quota.
  i2v: true                 # enable image-to-video motion (else Ken Burns pans)
  i2v_backend: local        # local (CPU depth-parallax) | kaggle (LTX GPU)
  i2v_max_clips: 0          # 0 = no cap (maximise coverage); else clips/video to save cost
  i2v_shots_per_image: 2    # local: camera-angle clips per image. With a full gallery
                            # (many real images/mod) 1-2 is plenty; raise it only when a
                            # mod has just one image and a segment would otherwise loop it
  target_shot_seconds: 5.0  # how long each shot plays before cutting/cross-fading to the next
  parallax_shift: 22        # local: camera sweep amplitude in px (higher = more motion)
  i2v_steps: 30             # kaggle/LTX: denoising steps (higher = nicer + slower)
  i2v_frames: 97            # kaggle/LTX: frames per clip (8k+1); 97 ≈ 4s @ 24fps
  # threads: 8              # default: all CPU cores
  # Multi-shot Ken Burns: one mod image becomes a new "camera move" every
  # ~shot_seconds, so a single permitted screenshot plays like b-roll.
  shot_seconds: 16
  intro_footage: true         # cinematic Skyrim trailer B-roll montage on the intro
  profiles:
    standard:                 # channel default: ~12 min, lands in the 10-15 band
      target_minutes: 12
      mods_per_video: 8         # ~8 mods at ~80s each + intro/outro ≈ 12 min
      seconds_per_mod: 80
      hook_seconds: 10          # cold open over trailer B-roll, NO logo intro
      intro_seconds: 22         # promise + pattern interrupt
      outro_seconds: 48         # CTA tied to the next upload
    test:
      target_minutes: 5
      mods_per_video: 4         # short proof-of-concept
      seconds_per_mod: 60
      hook_seconds: 8
      intro_seconds: 18
      outro_seconds: 30
    full:
      target_minutes: 20
      mods_per_video: 10        # 8-12 recommended
      seconds_per_mod: 100      # ~85-125s; deep-dive mods can run longer
      hook_seconds: 10          # cold open, best visual mod first, NO logo intro
      intro_seconds: 25         # promise + pattern interrupt
      outro_seconds: 60         # CTA tied to next week's topic

# Ranking weights for the research stage (how it picks "best" mods).
# Tuned to favour what's TRENDING NOW (higher recency weight) — combined with the
# "never repeat" history filter, each run surfaces fresh, currently-hot mods.
ranking:
  weight_endorsements: 0.35
  weight_downloads_recent: 0.30
  weight_recency: 0.30        # bias toward currently-trending / freshly-updated mods
  weight_has_media: 0.10
  require_media: true         # only feature mods that have showable media
  require_reuse_permission: true   # footage policy: only mods whose author permits media reuse
  # Deep scan: the v1 API has no "browse category by popularity" endpoint, so we
  # walk the recently-updated mod list and fetch details to find REAL category
  # matches (otherwise the tiny trending pool returns utilities like SkyUI).
  deep_scan: true
  scan_limit: 250             # max mod-detail lookups per run (rate-limit friendly)
  updated_period: "1m"        # 1d | 1w | 1m discovery window

# Branding for titles/thumbnails (Remotion + thumbnail generator read these).
branding:
  accent_color: "#d4af37"     # Skyrim gold
  secondary_color: "#1b2a3a"
  font_family: "Cinzel"
  watermark: "@ModVault"
  # Public base URL of the per-video mod-list pages (output/<slug>.modlist.md,
  # published separately). A hundred mod links don't fit YouTube's 5000-char
  # description, so it links here instead. Leave empty to fall back to pointing
  # at the pinned comment.
  mod_list_base_url: ""

  # Per-video mod-list pages, for hosts whose URLs carry an opaque id and so can't
  # be derived from the slug (Notion, Google Docs). Checked before
  # mod_list_base_url. A Notion page only resolves for viewers once it has been
  # published to web — the API cannot do that, so each page needs one manual
  # Share -> Publish to web.
  mod_list_urls:
    2026-09-19-adventures: ""
    2026-09-19-quests: ""
    2026-09-19-magic: ""
    2026-09-20-weapons: ""
    2026-09-21-alchemy: ""

# Title templates (research-backed). {n}, {category}, {year} are filled in.
# Channel-style titles (modeled on Heavy Burns / Syn Gaming / SoftGaming): a power
# word, a number, a year, and curiosity. Keep under ~70 chars so they don't truncate.
title_templates:
  category_list:
    - "The BEST Skyrim {category} Mods in {year}! ({n} You NEED)"
    - "These {n} Skyrim {category} Mods Are INSANE! ({year})"
    - "Top {n} Skyrim {category} Mods That Change EVERYTHING"
    - "REMASTER Your Skyrim {category} With These {n} Mods! ({year})"
  transformation:
    - "I REMASTERED Skyrim Into {theme} With {n} Mods!"
    - "Transforming Skyrim Into {theme}! (INSANE Mods {year})"
  weekly_roundup:
    - "These {n} NEW Skyrim Mods Blew Me Away! ({year})"
    - "REMASTER Your Skyrim in {year} With These INSANE NEW Mods!"
    - "{n} NEW Skyrim Mods You NEED to Try in {year}!"
  ranked_tier_list:
    - "I Ranked Every Skyrim {category} Mod So You Don't Have To"
    - "I Ranked {n} Skyrim {category} Mods (S Tier to C Tier)"
    - "Skyrim {category} Mods, Ranked ({year})"

# ranked_tier_list format: the on-screen tier board + per-mod scorecard/verdict card
# (edit/tier_list.py). Tiers are drawn hottest-first; scorecard_criteria are generic
# enough to fit any mod category — override per-project by editing this list.
tier_list:
  tiers: [S, A, B, C, D, F]
  scorecard_criteria: [Impact, Uniqueness, Polish, Compatibility]
  verdict_seconds: 5          # how long each mod's verdict card holds on screen
